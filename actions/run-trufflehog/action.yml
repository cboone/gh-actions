name: Run trufflehog
description: Install trufflehog binary and run a scan.

inputs:
  version:
    description: trufflehog version to install
    required: false
    default: "3.97.5"
  args:
    description: >-
      Scan arguments to pass to trufflehog, one per line. The action controls output format.
    required: false
    default: |-
      filesystem
      --directory
      .
  allowlist:
    description: >-
      Path to a JSON allowlist of reviewed findings, relative to the
      checkout. Each entry names a commit, path, line and detector, and
      matches only that finding. Leave unset to fail on every finding.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install trufflehog
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        case "$(uname -s)" in
          Linux) os="linux" ;;
          Darwin) os="darwin" ;;
          *)
            echo "Unsupported operating system: $(uname -s)" >&2
            exit 1
            ;;
        esac

        case "$(uname -m)" in
          x86_64) arch="amd64" ;;
          arm64|aarch64) arch="arm64" ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        install_dir="${RUNNER_TEMP}/trufflehog-bin"
        mkdir -p "${install_dir}"
        base="https://github.com/trufflesecurity/trufflehog/releases/download"
        archive="trufflehog_${VERSION}_${os}_${arch}.tar.gz"
        archive_path="${install_dir}/${archive}"
        curl -sSfL "${base}/v${VERSION}/${archive}" -o "${archive_path}"
        curl -sSfL "${base}/v${VERSION}/trufflehog_${VERSION}_checksums.txt" \
          -o "${install_dir}/checksums.txt"
        expected="$(grep -F "${archive}" "${install_dir}/checksums.txt" | head -1 | awk '{print $1}')"
        if [ -z "${expected}" ]; then
          echo "Checksum entry not found for ${archive}" >&2
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "${archive_path}" | awk '{print $1}')"
        else
          actual="$(shasum -a 256 "${archive_path}" | awk '{print $1}')"
        fi
        if [ "${expected}" != "${actual}" ]; then
          echo "Checksum verification failed for ${archive}" >&2
          echo "Expected: ${expected}" >&2
          echo "Actual:   ${actual}" >&2
          exit 1
        fi
        tar -xz -C "${install_dir}" -f "${archive_path}" trufflehog
        printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"
        "${install_dir}/trufflehog" --version

    - name: Run trufflehog
      shell: bash
      env:
        TRUFFLEHOG_ARGS: ${{ inputs.args }}
        TRUFFLEHOG_ALLOWLIST: ${{ inputs.allowlist }}
        ALLOWLIST_CHECKER: ${{ github.action_path }}/check-allowlist.sh
      run: |
        set +x
        umask 077
        # Encode a workflow-command annotation's data, mirroring the helper in
        # install-pinned-tool.sh. The allowlist error repeats a caller-supplied
        # path, and a CR or LF in it would otherwise start a line the
        # runner reads as another workflow command.
        escape_data() {
          local text="${1}"
          local percent='%'
          local cr=$'\r'
          local lf=$'\n'
          text="${text//"${percent}"/%25}"
          text="${text//"${cr}"/%0D}"
          text="${text//"${lf}"/%0A}"
          printf '%s' "${text}"
        }
        args=()
        while IFS= read -r line; do
          case "${line%%=*}" in
            --no-update | --fail | -j | --json | --no-json) continue ;;
            --json-legacy | --sarif | --github-actions | --output-report)
              printf '::error::run-trufflehog controls scanner output. Remove %s from args.\n' \
                "${line%%=*}" >&2
              exit 1
              ;;
          esac
          if [[ -n "${line}" ]]; then
            args+=("${line}")
          fi
        done <<<"${TRUFFLEHOG_ARGS}"
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error::jq is required to report TruffleHog findings and is not on PATH." >&2
          exit 1
        fi
        if [[ -n "${TRUFFLEHOG_ALLOWLIST}" && ! -f "${TRUFFLEHOG_ALLOWLIST}" ]]; then
          msg="allowlist '${TRUFFLEHOG_ALLOWLIST}' is not a file in the checkout."
          printf '::error::%s\n' "$(escape_data "${msg}")" >&2
          exit 1
        fi
        # Keep the pinned binary and report verified findings and verification errors.
        # Either scanner stream can contain credential material.
        scan_dir="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/trufflehog-scan.XXXXXX")"
        findings="${scan_dir}/findings.json"
        diagnostics="${scan_dir}/stderr"
        trap 'rm -f -- "${findings}" "${diagnostics}" && rmdir -- "${scan_dir}"' EXIT
        status=0
        trufflehog ${args[@]+"${args[@]}"} --no-update --results=verified,unknown --fail \
          --json >"${findings}" 2>"${diagnostics}" || status=$?
        checker_args=(--findings "${findings}")
        if [[ -n "${TRUFFLEHOG_ALLOWLIST}" ]]; then
          checker_args+=(--allowlist "${TRUFFLEHOG_ALLOWLIST}")
        fi
        if [[ "${status}" -eq 183 ]]; then
          # Tell the checker results were reported, so a findings file it
          # cannot read fails instead of reading as a clean scan.
          checker_args+=(--expect-findings)
        fi
        checker_status=0
        if [[ "${status}" -eq 0 || "${status}" -eq 183 || -s "${findings}" ]]; then
          "${ALLOWLIST_CHECKER}" "${checker_args[@]}" || checker_status=$?
        fi
        if [[ "${status}" -ne 0 && "${status}" -ne 183 ]]; then
          echo "::error::trufflehog could not complete the scan (exit ${status})." >&2
          exit "${status}"
        fi
        if [[ -z "${TRUFFLEHOG_ALLOWLIST}" && "${checker_status}" -eq 1 ]]; then
          if [[ "${status}" -eq 183 ]]; then
            exit "${status}"
          fi
          echo "::error::TruffleHog wrote findings but did not return its findings exit status." >&2
          exit 2
        fi
        exit "${checker_status}"
