name: Run gitleaks
description: Install gitleaks binary and run a scan.

inputs:
  version:
    description: gitleaks version to install
    required: false
    default: "8.30.1"
  args:
    description: >-
      Scan arguments to pass to gitleaks, one per line. The action controls redaction and reports.
    required: false
    default: |-
      detect
      --source
      .

runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        case "$(uname -s)" in
          Linux) os="linux" ;;
          Darwin) os="darwin" ;;
          *)
            echo "Unsupported operating system: $(uname -s)" >&2
            exit 1
            ;;
        esac

        case "$(uname -m)" in
          x86_64) arch="x64" ;;
          arm64|aarch64) arch="arm64" ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        install_dir="${RUNNER_TEMP}/gitleaks-bin"
        mkdir -p "${install_dir}"
        base="https://github.com/gitleaks/gitleaks/releases/download"
        archive="gitleaks_${VERSION}_${os}_${arch}.tar.gz"
        archive_path="${install_dir}/${archive}"
        curl -sSfL "${base}/v${VERSION}/${archive}" -o "${archive_path}"
        curl -sSfL "${base}/v${VERSION}/gitleaks_${VERSION}_checksums.txt" \
          -o "${install_dir}/checksums.txt"
        expected="$(grep -F "${archive}" "${install_dir}/checksums.txt" | head -1 | awk '{print $1}')"
        if [ -z "${expected}" ]; then
          echo "Checksum entry not found for ${archive}" >&2
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "${archive_path}" | awk '{print $1}')"
        else
          actual="$(shasum -a 256 "${archive_path}" | awk '{print $1}')"
        fi
        if [ "${expected}" != "${actual}" ]; then
          echo "Checksum verification failed for ${archive}" >&2
          echo "Expected: ${expected}" >&2
          echo "Actual:   ${actual}" >&2
          exit 1
        fi
        tar -xz -C "${install_dir}" -f "${archive_path}" gitleaks
        printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"
        "${install_dir}/gitleaks" version

    - name: Run gitleaks
      shell: bash
      env:
        GITLEAKS_ARGS: ${{ inputs.args }}
      run: |
        args=()
        while IFS= read -r line; do
          case "${line}" in
            "") continue ;;
            --redact|--redact=100) ;;
            --redact=*|--report-path|--report-path=*|--report-format|--report-format=*|\
            --report-template|--report-template=*)
              echo "::error::run-gitleaks controls redaction and report options." >&2
              exit 1
              ;;
          esac
          # -f and -r can have attached values or follow -v in a short option group.
          if [[ "${line}" =~ ^-[vh]*[fr] ]]; then
            echo "::error::run-gitleaks controls report options (-f and -r)." >&2
            exit 1
          fi
          args+=("${line}")
        done <<< "${GITLEAKS_ARGS}"
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error::jq is required to report Gitleaks findings and is not on PATH." >&2
          exit 1
        fi
        scan_dir="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/gitleaks-scan.XXXXXX")"
        report="${scan_dir}/findings.json"
        trap 'rm -f -- "${report}" && rmdir -- "${scan_dir}"' EXIT
        status=0
        # Required rules can still carry matched values after --redact=100.
        gitleaks --redact=100 --report-format json --report-path "${report}" \
          ${args[@]+"${args[@]}"} >/dev/null 2>&1 || status=$?
        if [[ ! -f "${report}" && "${status}" -ne 0 ]]; then
          echo "::error::gitleaks could not complete the scan (exit ${status})." >&2
          exit "${status}"
        fi
        if ! jq -ser --arg status "${status}" '
          if length != 1 or (.[0] | type) != "array" then error("invalid report")
          else .[0] end
          | if all(.[]; (.Fingerprint | type) == "string" and (.File | type) == "string"
              and (.StartLine | type) == "number" and (.RuleID | type) == "string") then .
            else error("invalid finding") end
          | if length == 0 and $status != "0" then error("scan failed")
            elif length == 0 then "no leaks found"
            else (
              .[] | "fingerprint=\(.Fingerprint | tojson) file=\(.File | tojson)"
                + " line=\(.StartLine | tojson) rule=\(.RuleID | tojson)"
            ), "leaks found: \(length)" end
        ' "${report}" 2>/dev/null; then
          echo "::error::gitleaks did not produce a usable findings report (exit ${status})." >&2
          exit "$((status == 0 ? 1 : status))"
        fi
        exit "${status}"
