name: Set up shfmt
description: Install shfmt binary with a pinned version.

inputs:
  version:
    description: >-
      shfmt version to install. When overriding it, pass that version's
      checksums in `checksums` too.
    required: false
    default: "3.14.1"
  checksums:
    description: >-
      SHA-256 of each shfmt release binary, one
      `<sha256>  <asset file name>` line per platform, as `sha256sum`
      prints them. shfmt releases from v3.13.0 on ship no checksum file
      (mvdan/sh#1283, mvdan/sh#1309), so these are committed here. The
      default covers v3.14.1 on Linux and macOS, amd64 and arm64.
    required: false
    default: |
      76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt_v3.14.1_linux_amd64
      5f2db09dae91fca848f7adbdd014632e921a383863a2ad7e0450ad3aba0c6489  shfmt_v3.14.1_linux_arm64
      d33eee0da0f92835b3562e9767a05cee7e4eaeef47daa03bfd09da17b4b590a6  shfmt_v3.14.1_darwin_amd64
      b7c872db63553ccffc7253aba3ed7d4885a27d83f1ba567b1138c6315a5847e5  shfmt_v3.14.1_darwin_arm64

runs:
  using: composite
  steps:
    - name: Install shfmt
      shell: bash
      env:
        # install-pinned-tool is a sibling of this action inside the
        # gh-actions checkout the runner makes when loading it, so both come
        # from the same commit. Unused installer variables are set empty so
        # a caller's job-level env cannot reach the installer. INSTALLER stays
        # in `env:` because, for a job that sets `container:`, the runner
        # translates host paths there but not in expressions in `run:`.
        INSTALLER: ${{ github.action_path }}/../install-pinned-tool/install-pinned-tool.sh
        TOOL: shfmt
        VERSION: ${{ inputs.version }}
        URL_TEMPLATE: https://github.com/mvdan/sh/releases/download/v{version}/shfmt_v{version}_{os}_{arch}
        CHECKSUM: ""
        CHECKSUMS: ${{ inputs.checksums }}
        CHECKSUMS_URL_TEMPLATE: ""
        ARCHIVE_MEMBER: ""
        OS_NAMES: ""
        ARCH_NAMES: ""
      run: bash "${INSTALLER}"

    - name: Report shfmt version
      shell: bash
      run: shfmt --version
