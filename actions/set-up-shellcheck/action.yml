name: Set up shellcheck
description: Install shellcheck binary with a pinned version.

inputs:
  version:
    description: >-
      shellcheck version to install. When overriding it, pass that version's
      checksums in `checksums` too.
    required: false
    default: "0.11.0"
  checksums:
    description: >-
      SHA-256 of each shellcheck release archive, one
      `<sha256>  <asset file name>` line per platform, as `sha256sum`
      prints them. shellcheck releases ship no checksum file and publish
      no digests in their release notes, so these are committed here. The
      default covers v0.11.0 on Linux and macOS, amd64 and arm64.
    required: false
    default: |
      8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck-v0.11.0.linux.x86_64.tar.xz
      12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588  shellcheck-v0.11.0.linux.aarch64.tar.xz
      3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6  shellcheck-v0.11.0.darwin.x86_64.tar.xz
      56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79  shellcheck-v0.11.0.darwin.aarch64.tar.xz

runs:
  using: composite
  steps:
    - name: Install shellcheck
      shell: bash
      env:
        # install-pinned-tool is a sibling of this action inside the
        # gh-actions checkout the runner makes when loading it, so both come
        # from the same commit. Unused installer variables are set empty so
        # a caller's job-level env cannot reach the installer. INSTALLER stays
        # in `env:` because, for a job that sets `container:`, the runner
        # translates host paths there but not in expressions in `run:`.
        INSTALLER: ${{ github.action_path }}/../install-pinned-tool/install-pinned-tool.sh
        TOOL: shellcheck
        VERSION: ${{ inputs.version }}
        URL_TEMPLATE: https://github.com/koalaman/shellcheck/releases/download/v{version}/shellcheck-v{version}.{os}.{arch}.tar.xz
        CHECKSUM: ""
        CHECKSUMS: ${{ inputs.checksums }}
        CHECKSUMS_URL_TEMPLATE: ""
        ARCHIVE_MEMBER: shellcheck-v{version}/shellcheck
        OS_NAMES: ""
        ARCH_NAMES: amd64=x86_64 arm64=aarch64
      run: bash "${INSTALLER}"

    - name: Report shellcheck version
      shell: bash
      run: shellcheck --version
