name: Run reuse
description: >-
  Run `reuse` (default: `reuse lint`) to verify SPDX/REUSE compliance.
  Replaces fsfe/reuse-action with a thin wrapper that installs reuse
  from this repo's hash-pinned `requirements/reuse.txt` (every
  transitive dependency is sha256-pinned), so a tampered PyPI response
  cannot slip past the install. uv is downloaded with sha256
  verification.

inputs:
  uv-version:
    description: uv version to install for the reuse install step.
    required: false
    default: "0.12.17"
  args:
    description: >-
      Arguments to pass to `reuse`. Newline-delimited; each line
      becomes a separate positional argument. Defaults to `lint`.
    required: false
    default: "lint"

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      env:
        # install-pinned-tool is a sibling of this action inside the
        # gh-actions checkout the runner makes when loading it, so both come
        # from the same commit. A `uses: ./` reference would resolve against
        # the caller's workspace instead, and that applies to the sibling
        # set-up-uv action too, so this action drives the installer directly.
        # Unused installer variables are set empty so a caller's job-level
        # env cannot reach the installer. INSTALLER stays in `env:` because,
        # for a job that sets `container:`, the runner translates host paths
        # there but not in expressions in `run:`.
        INSTALLER: ${{ github.action_path }}/../install-pinned-tool/install-pinned-tool.sh
        TOOL: uv
        VERSION: ${{ inputs.uv-version }}
        URL_TEMPLATE: https://github.com/astral-sh/uv/releases/download/{version}/uv-{arch}-{os}.tar.gz
        CHECKSUM: ""
        CHECKSUMS: ""
        CHECKSUMS_URL_TEMPLATE: https://github.com/astral-sh/uv/releases/download/{version}/uv-{arch}-{os}.tar.gz.sha256
        # uv ships each platform's binary inside a directory named for the
        # target triple, so the member path needs the same renames the URL
        # does.
        ARCHIVE_MEMBER: uv-{arch}-{os}/uv
        OS_NAMES: linux=unknown-linux-gnu darwin=apple-darwin
        ARCH_NAMES: amd64=x86_64 arm64=aarch64
      run: bash "${INSTALLER}"

    - name: Report uv version
      shell: bash
      run: uv --version

    - name: Install reuse with hash-pinned requirements
      shell: bash
      env:
        # `${{ github.action_path }}` points at this action's directory
        # inside the gh-actions repo checkout the runner made to load
        # the composite action; the repo root (which holds
        # requirements/reuse.txt) is two levels up. Pinning the
        # manifest to the SHA the action was loaded at means a tampered
        # PyPI response cannot pass the per-package hash check.
        REQUIREMENTS_FILE: ${{ github.action_path }}/../../requirements/reuse.txt
      run: |
        if [ ! -f "${REQUIREMENTS_FILE}" ]; then
          echo "::error::requirements file not found: ${REQUIREMENTS_FILE}" >&2
          exit 1
        fi
        venv_dir="${RUNNER_TEMP}/reuse-venv"
        uv venv "${venv_dir}" --quiet
        uv pip install \
          --python "${venv_dir}/bin/python" \
          --require-hashes \
          -r "${REQUIREMENTS_FILE}" \
          --quiet
        printf '%s\n' "${venv_dir}/bin" >> "${GITHUB_PATH}"
        "${venv_dir}/bin/reuse" --version

    - name: Run reuse
      shell: bash
      env:
        REUSE_ARGS: ${{ inputs.args }}
      run: |
        args=()
        while IFS= read -r line; do
          [ -n "${line}" ] && args+=("${line}")
        done <<< "${REUSE_ARGS}"
        reuse "${args[@]}"
