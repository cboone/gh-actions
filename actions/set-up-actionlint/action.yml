name: Set up actionlint
description: Install actionlint binary with a pinned version.

inputs:
  version:
    description: actionlint version to install
    required: false
    default: "1.7.12"

runs:
  using: composite
  steps:
    - name: Install actionlint
      shell: bash
      env:
        # install-pinned-tool is a sibling of this action inside the
        # gh-actions checkout the runner makes when loading it, so both come
        # from the same commit. Unused installer variables are set empty so
        # a caller's job-level env cannot reach the installer. INSTALLER stays
        # in `env:` because, for a job that sets `container:`, the runner
        # translates host paths there but not in expressions in `run:`.
        INSTALLER: ${{ github.action_path }}/../install-pinned-tool/install-pinned-tool.sh
        TOOL: actionlint
        VERSION: ${{ inputs.version }}
        URL_TEMPLATE: https://github.com/rhysd/actionlint/releases/download/v{version}/actionlint_{version}_{os}_{arch}.tar.gz
        CHECKSUM: ""
        CHECKSUMS: ""
        CHECKSUMS_URL_TEMPLATE: https://github.com/rhysd/actionlint/releases/download/v{version}/actionlint_{version}_checksums.txt
        ARCHIVE_MEMBER: actionlint
        OS_NAMES: ""
        ARCH_NAMES: ""
      run: bash "${INSTALLER}"

    - name: Report actionlint version
      shell: bash
      run: actionlint -version
