# actionlint v1.7.12 predates the `job` context properties GitHub shipped on
# 2026-09-03 (`job.workflow_ref`, `job.workflow_sha`, `job.workflow_repository`,
# `job.workflow_file_path`), so it reports them as undefined. `lint-text.yml`,
# `lint-shell.yml` and `lint-github-actions.yml` use `job.workflow_repository`
# and `job.workflow_sha` to pin their raw.githubusercontent.com fetches to the
# repository and commit the workflow file itself came from.
#
# The pattern is anchored on `{check_run_id:`, which opens the `job` object
# type, so a genuinely misspelled `workflow_sha` on any other object still
# errors. Delete this file once actionlint recognizes the properties;
# scripts/check-tool-versions.py carries a reminder on the actionlint entry.

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'property "workflow_(sha|repository|ref|file_path)" is not defined in object type \{check_run_id:'
