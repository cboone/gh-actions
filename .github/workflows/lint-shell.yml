name: Lint shell

on:
  workflow_call:
    inputs:
      run-shellcheck:
        description: Run ShellCheck.
        type: boolean
        default: true
      run-shfmt:
        description: Run shfmt format check.
        type: boolean
        default: true
      shellcheck-version:
        description: >-
          shellcheck version to install. When overriding it, pass that
          version's checksums in shellcheck-checksums too.
        type: string
        default: "0.11.0"
      shellcheck-checksums:
        description: >-
          SHA-256 of each shellcheck release archive, one
          `<sha256>  <asset file name>` line per platform, as sha256sum
          prints them. shellcheck releases ship no checksum file and publish
          no digests in their release notes, so these are committed here. The
          job runs on ubuntu-latest, so an override needs at least the
          linux.x86_64 line.
        type: string
        default: |
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck-v0.11.0.linux.x86_64.tar.xz
          12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588  shellcheck-v0.11.0.linux.aarch64.tar.xz
          3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6  shellcheck-v0.11.0.darwin.x86_64.tar.xz
          56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79  shellcheck-v0.11.0.darwin.aarch64.tar.xz
      shfmt-version:
        description: >-
          shfmt version to install. When overriding it, pass that version's
          checksums in shfmt-checksums too.
        type: string
        default: "3.13.1"
      shfmt-checksums:
        description: >-
          SHA-256 of each shfmt release binary, one
          `<sha256>  <asset file name>` line per platform, as sha256sum
          prints them. shfmt releases from v3.13.0 on ship no checksum file
          (mvdan/sh#1283, mvdan/sh#1309), so these are committed here. The
          job runs on ubuntu-latest, so an override needs at least the
          linux_amd64 line.
        type: string
        default: |
          fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  shfmt_v3.13.1_linux_amd64
          32d92acaa5cd8abb29fc49dac123dc412442d5713967819d8af2c29f1b3857c7  shfmt_v3.13.1_linux_arm64
          6feedafc72915794163114f512348e2437d080d0047ef8b8fa2ec63b575f12af  shfmt_v3.13.1_darwin_amd64
          9680526be4a66ea1ffe988ed08af58e1400fe1e4f4aef5bd88b20bb9b3da33f8  shfmt_v3.13.1_darwin_arm64
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 10

permissions:
  contents: read

jobs:
  shell-lint:
    name: Shell lint
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetch the installer from the repository and commit this workflow
      # file came from, the supply-chain model lint-text.yml uses for its
      # manifests, so the script and this workflow always share a commit. A
      # `./` action path would resolve against the caller's checkout
      # instead. The `job` context is only available on steps, so the two
      # values are bound here rather than at job or workflow level. The
      # step runs when either checker is enabled, because discovery itself
      # needs shfmt even when only ShellCheck is enabled.
      - name: Fetch install-pinned-tool
        if: inputs.run-shellcheck || inputs.run-shfmt
        env:
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "${REQ_REPO}" ] || [ -z "${REQ_SHA}" ]; then
            msg="job.workflow_repository or job.workflow_sha is unavailable,"
            msg="${msg} so this workflow cannot fetch its pinned installer."
            msg="${msg} Neither is populated on GitHub Enterprise Server; run"
            msg="${msg} ShellCheck and shfmt in your own job with the"
            msg="${msg} set-up-shellcheck and set-up-shfmt actions there."
            echo "::error::${msg}" >&2
            exit 1
          fi
          base="https://raw.githubusercontent.com/${REQ_REPO}/${REQ_SHA}"
          echo "Fetching from ${base}"
          curl -sSfL --proto '=https' --retry 3 --retry-delay 5 --retry-all-errors \
            "${base}/actions/install-pinned-tool/install-pinned-tool.sh" \
            -o "${RUNNER_TEMP}/install-pinned-tool.sh"

      - name: Install shfmt
        if: inputs.run-shellcheck || inputs.run-shfmt
        env:
          TOOL: shfmt
          VERSION: ${{ inputs.shfmt-version }}
          URL_TEMPLATE: https://github.com/mvdan/sh/releases/download/v{version}/shfmt_v{version}_{os}_{arch}
          CHECKSUMS: ${{ inputs.shfmt-checksums }}
        run: bash "${RUNNER_TEMP}/install-pinned-tool.sh"

      - name: Find shell scripts
        id: find-scripts
        if: inputs.run-shellcheck || inputs.run-shfmt
        run: |
          # shfmt 3.13.1's -f=0 treats explicit files as shell scripts even
          # without a shell extension or shebang. Use -f per tracked file,
          # then retain the original path in a NUL-separated manifest.
          git ls-files -z > "${RUNNER_TEMP}/tracked-files.txt"
          : > "${RUNNER_TEMP}/shell-scripts.txt"
          while IFS= read -r -d '' path; do
            # Exclude submodule directories and symlinks to untracked files.
            if [[ ! -f "${path}" || -L "${path}" ]]; then
              continue
            fi
            # A bare '-' means stdin to the checkers, even after '--'.
            if [[ "${path}" == '-' ]]; then
              path="./-"
            fi
            shfmt -f -- "${path}" > "${RUNNER_TEMP}/shell-candidate.txt"
            if [[ -s "${RUNNER_TEMP}/shell-candidate.txt" ]]; then
              printf '%s\0' "${path}" >> "${RUNNER_TEMP}/shell-scripts.txt"
            fi
          done < "${RUNNER_TEMP}/tracked-files.txt"
          if [[ -s "${RUNNER_TEMP}/shell-scripts.txt" ]]; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
            msg="No tracked shell scripts found; ShellCheck and shfmt checks were skipped."
            echo "::notice::${msg}"
            echo "${msg}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Pinned rather than taken from the runner image, so a runner image
      # update cannot change what this job reports, and so it lints with the
      # same shellcheck lint-github-actions.yml gives actionlint.
      - name: Install shellcheck
        if: >-
          inputs.run-shellcheck
          && steps.find-scripts.outputs.found == 'true'
        env:
          TOOL: shellcheck
          VERSION: ${{ inputs.shellcheck-version }}
          URL_TEMPLATE: https://github.com/koalaman/shellcheck/releases/download/v{version}/shellcheck-v{version}.{os}.{arch}.tar.xz
          CHECKSUMS: ${{ inputs.shellcheck-checksums }}
          ARCHIVE_MEMBER: shellcheck-v{version}/shellcheck
          ARCH_NAMES: amd64=x86_64 arm64=aarch64
        run: bash "${RUNNER_TEMP}/install-pinned-tool.sh"

      - name: Run ShellCheck
        if: >-
          inputs.run-shellcheck
          && steps.find-scripts.outputs.found == 'true'
        run: |
          shellcheck --version
          xargs -0 shellcheck -- < "${RUNNER_TEMP}/shell-scripts.txt"

      - name: Run shfmt check
        if: >-
          inputs.run-shfmt
          && steps.find-scripts.outputs.found == 'true'
        run: |
          # No style flags: shfmt reads .editorconfig, and flags such as
          # -i would disable those settings entirely.
          xargs -0 shfmt -d -- < "${RUNNER_TEMP}/shell-scripts.txt"
