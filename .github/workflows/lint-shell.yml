name: Lint shell

on:
  workflow_call:
    inputs:
      run-shellcheck:
        description: Run ShellCheck.
        type: boolean
        default: true
      run-shfmt:
        description: Run shfmt format check.
        type: boolean
        default: true
      shellcheck-version:
        description: >-
          shellcheck version to install. When overriding it, pass that
          version's checksums in shellcheck-checksums too.
        type: string
        default: "0.11.0"
      shellcheck-checksums:
        description: >-
          SHA-256 of each shellcheck release archive, one
          `<sha256>  <asset file name>` line per platform, as sha256sum
          prints them. shellcheck releases ship no checksum file and publish
          no digests in their release notes, so these are committed here. The
          job runs on ubuntu-latest, so an override needs at least the
          linux.x86_64 line.
        type: string
        default: |
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck-v0.11.0.linux.x86_64.tar.xz
          12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588  shellcheck-v0.11.0.linux.aarch64.tar.xz
          3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6  shellcheck-v0.11.0.darwin.x86_64.tar.xz
          56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79  shellcheck-v0.11.0.darwin.aarch64.tar.xz
      shfmt-version:
        description: >-
          shfmt version to install. When overriding it, pass that version's
          checksums in shfmt-checksums too.
        type: string
        default: "3.14.1"
      shfmt-checksums:
        description: >-
          SHA-256 of each shfmt release binary, one
          `<sha256>  <asset file name>` line per platform, as sha256sum
          prints them. shfmt releases from v3.13.0 on ship no checksum file
          (mvdan/sh#1283, mvdan/sh#1309), so these are committed here. The
          job runs on ubuntu-latest, so an override needs at least the
          linux_amd64 line.
        type: string
        default: |
          76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt_v3.14.1_linux_amd64
          5f2db09dae91fca848f7adbdd014632e921a383863a2ad7e0450ad3aba0c6489  shfmt_v3.14.1_linux_arm64
          d33eee0da0f92835b3562e9767a05cee7e4eaeef47daa03bfd09da17b4b590a6  shfmt_v3.14.1_darwin_amd64
          b7c872db63553ccffc7253aba3ed7d4885a27d83f1ba567b1138c6315a5847e5  shfmt_v3.14.1_darwin_arm64
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 10

permissions:
  contents: read

jobs:
  shell-lint:
    name: Shell lint
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fetch the installer from the repository and commit this workflow
      # file came from, the supply-chain model lint-text.yml uses for its
      # manifests, so the script and this workflow always share a commit. A
      # `./` action path would resolve against the caller's checkout
      # instead. The `job` context is only available on steps, so the two
      # values are bound here rather than at job or workflow level. The
      # step runs when either checker is enabled, because discovery itself
      # needs shfmt even when only ShellCheck is enabled.
      - name: Fetch install-pinned-tool
        if: inputs.run-shellcheck || inputs.run-shfmt
        env:
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "${REQ_REPO}" ] || [ -z "${REQ_SHA}" ]; then
            msg="job.workflow_repository or job.workflow_sha is unavailable,"
            msg="${msg} so this workflow cannot fetch its pinned installer."
            msg="${msg} Neither is populated on GitHub Enterprise Server; run"
            msg="${msg} ShellCheck and shfmt in your own job with the"
            msg="${msg} set-up-shellcheck and set-up-shfmt actions there."
            echo "::error::${msg}" >&2
            exit 1
          fi
          base="https://raw.githubusercontent.com/${REQ_REPO}/${REQ_SHA}"
          echo "Fetching from ${base}"
          curl -sSfL --proto '=https' --retry 3 --retry-delay 5 --retry-all-errors \
            "${base}/actions/install-pinned-tool/install-pinned-tool.sh" \
            -o "${RUNNER_TEMP}/install-pinned-tool.sh"

      - name: Install shfmt
        if: inputs.run-shellcheck || inputs.run-shfmt
        env:
          TOOL: shfmt
          VERSION: ${{ inputs.shfmt-version }}
          URL_TEMPLATE: https://github.com/mvdan/sh/releases/download/v{version}/shfmt_v{version}_{os}_{arch}
          CHECKSUMS: ${{ inputs.shfmt-checksums }}
        run: bash "${RUNNER_TEMP}/install-pinned-tool.sh"

      - name: Find shell scripts
        id: find-scripts
        if: inputs.run-shellcheck || inputs.run-shfmt
        run: |
          # Reduce the tracked tree to the regular files a checker can read,
          # retaining each original path in a NUL-separated list. This loop
          # forks nothing: `[[` is a shell keyword and `printf` a builtin.
          # Its guard is load-bearing for either discovery path, because
          # shfmt walks a directory argument and would otherwise pull
          # untracked files out of a submodule.
          git ls-files -z > "${RUNNER_TEMP}/tracked-files.txt"
          : > "${RUNNER_TEMP}/shell-scripts.txt"
          while IFS= read -r -d '' path; do
            # Exclude submodule directories and symlinks to untracked files.
            if [[ ! -f "${path}" || -L "${path}" ]]; then
              continue
            fi
            # A bare '-' means stdin to the checkers, even after '--'.
            if [[ "${path}" == '-' ]]; then
              path="./-"
            fi
            printf '%s\0' "${path}"
          done < "${RUNNER_TEMP}/tracked-files.txt" \
            > "${RUNNER_TEMP}/discovery-input.txt"
          # This guard is load-bearing beyond skipping empty work: GNU xargs,
          # which ubuntu-latest has, runs its command once on empty input,
          # and `shfmt -f=0` with no operands emits a newline that would
          # become a one-entry manifest holding a bogus path. `-r` below
          # covers the same case; both stay, because each stands alone.
          if [[ -s "${RUNNER_TEMP}/discovery-input.txt" ]]; then
            # `shfmt -f=0` classifies the whole set in one call. shfmt added
            # that flag in 3.11.0 and did not filter explicitly supplied
            # non-shell files out of it until 3.14.0, where the guard in
            # cmd/shfmt/main.go became `find.val != "false"`. No release note
            # records the change, so cite the guard rather than the notes.
            # shfmt-version is caller-overridable, so ask the installed
            # binary to classify a prose file instead of parsing
            # `shfmt --version`, which cannot tell a release that lacks the
            # flag from one that has it and gets it wrong. The probe lives
            # outside the checkout, so it cannot reach the manifest.
            probe="${RUNNER_TEMP}/shfmt-find-probe"
            printf '%s\n' 'Prose, so no shell dialect can claim it.' > "${probe}"
            probe_status=0
            shfmt -f=0 -- "${probe}" > "${probe}.out" 2> "${probe}.err" \
              || probe_status=$?
            # Only a refused flag or an echoed-back probe is evidence about
            # the version. 126 and up mean shfmt could not be run at all,
            # which is a machine fault and must not be reported as an old pin.
            if [[ "${probe_status}" -ge 126 ]]; then
              msg="shfmt could not be run: exit ${probe_status}."
              msg="${msg} This is not a version problem, so discovery cannot"
              msg="${msg} continue. shfmt reported:"
              msg="${msg} $(tr '\n' ' ' < "${probe}.err")"
              echo "::error::${msg}" >&2
              exit 1
            fi
            batched=true
            if [[ "${probe_status}" -ne 0 || -s "${probe}.out" ]]; then
              batched=false
            fi
            if [[ "${batched}" == true ]]; then
              xargs -0 -r shfmt -f=0 -- < "${RUNNER_TEMP}/discovery-input.txt" \
                > "${RUNNER_TEMP}/shell-scripts.txt"
            else
              # Both causes, because the probe selects this branch either
              # way and a caller below 3.11.0 has no such mode to fix.
              msg="The installed shfmt either lacks its NUL-separated find"
              msg="${msg} mode or does not filter explicitly supplied"
              msg="${msg} non-shell files out of it, so discovery is checking"
              msg="${msg} one file at a time. Pin shfmt 3.14.0 or later to"
              msg="${msg} discover in a single pass."
              echo "::notice::${msg}"
              if [[ -s "${probe}.err" ]]; then
                echo "shfmt reported: $(tr '\n' ' ' < "${probe}.err")"
              fi
              while IFS= read -r -d '' path; do
                shfmt -f -- "${path}" > "${RUNNER_TEMP}/shell-candidate.txt"
                if [[ -s "${RUNNER_TEMP}/shell-candidate.txt" ]]; then
                  printf '%s\0' "${path}"
                fi
              done < "${RUNNER_TEMP}/discovery-input.txt" \
                > "${RUNNER_TEMP}/shell-scripts.txt"
            fi
          fi
          if [[ -s "${RUNNER_TEMP}/shell-scripts.txt" ]]; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
            msg="No tracked shell scripts found; ShellCheck and shfmt checks were skipped."
            echo "::notice::${msg}"
            echo "${msg}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Pinned rather than taken from the runner image, so a runner image
      # update cannot change what this job reports, and so it lints with the
      # same shellcheck lint-github-actions.yml gives actionlint.
      - name: Install shellcheck
        if: >-
          inputs.run-shellcheck
          && steps.find-scripts.outputs.found == 'true'
        env:
          TOOL: shellcheck
          VERSION: ${{ inputs.shellcheck-version }}
          URL_TEMPLATE: https://github.com/koalaman/shellcheck/releases/download/v{version}/shellcheck-v{version}.{os}.{arch}.tar.xz
          CHECKSUMS: ${{ inputs.shellcheck-checksums }}
          ARCHIVE_MEMBER: shellcheck-v{version}/shellcheck
          ARCH_NAMES: amd64=x86_64 arm64=aarch64
        run: bash "${RUNNER_TEMP}/install-pinned-tool.sh"

      - name: Run ShellCheck
        if: >-
          inputs.run-shellcheck
          && steps.find-scripts.outputs.found == 'true'
        run: |
          shellcheck --version
          xargs -0 shellcheck -- < "${RUNNER_TEMP}/shell-scripts.txt"

      - name: Run shfmt check
        if: >-
          inputs.run-shfmt
          && steps.find-scripts.outputs.found == 'true'
        run: |
          # No style flags: shfmt reads .editorconfig, and flags such as
          # -i would disable those settings entirely.
          xargs -0 shfmt -d -- < "${RUNNER_TEMP}/shell-scripts.txt"
