name: Lint shell

on:
  workflow_call:
    inputs:
      run-shellcheck:
        description: Run ShellCheck.
        type: boolean
        default: true
      run-shfmt:
        description: Run shfmt format check.
        type: boolean
        default: true
      shfmt-version:
        description: >-
          shfmt version to install. When overriding it, pass that version's
          checksums in shfmt-checksums too.
        type: string
        default: "3.13.1"
      shfmt-checksums:
        description: >-
          SHA-256 of each shfmt release binary, one
          `<sha256>  <asset file name>` line per platform, as sha256sum
          prints them. shfmt releases from v3.13.0 on ship no checksum file
          (mvdan/sh#1283, mvdan/sh#1309), so these are committed here. The
          job runs on ubuntu-latest, so an override needs at least the
          linux_amd64 line.
        type: string
        default: |
          fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  shfmt_v3.13.1_linux_amd64
          32d92acaa5cd8abb29fc49dac123dc412442d5713967819d8af2c29f1b3857c7  shfmt_v3.13.1_linux_arm64
          6feedafc72915794163114f512348e2437d080d0047ef8b8fa2ec63b575f12af  shfmt_v3.13.1_darwin_amd64
          9680526be4a66ea1ffe988ed08af58e1400fe1e4f4aef5bd88b20bb9b3da33f8  shfmt_v3.13.1_darwin_arm64
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 10

permissions:
  contents: read

jobs:
  shell-lint:
    name: Shell lint
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Find shell scripts
        id: find-scripts
        run: |
          {
            find . \( -name '*.sh' -o -name '*.bash' \) \
              -not -path '*/node_modules/*' \
              -not -path '*/.git/*' \
              -print0 2>/dev/null \
              | xargs -0 -r printf '%s\n' || true
            find bin/ scripts/ script/ -type f -print0 2>/dev/null \
              | xargs -0 -r file --mime-type 2>/dev/null \
              | grep 'text/x-shellscript' \
              | cut -d: -f1 || true
          } | sort -u | grep -v '^$' > /tmp/shell-scripts.txt || true
          {
            echo "files<<DELIM"
            cat /tmp/shell-scripts.txt
            echo "DELIM"
          } >> "${GITHUB_OUTPUT}"
          if [ -s /tmp/shell-scripts.txt ]; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run ShellCheck
        if: >-
          inputs.run-shellcheck
          && steps.find-scripts.outputs.found == 'true'
        env:
          SHELL_SCRIPTS: ${{ steps.find-scripts.outputs.files }}
        run: |
          echo "${SHELL_SCRIPTS}" | tr '\n' '\0' | xargs -0 shellcheck

      # Fetch the installer from the repository and commit this workflow
      # file came from, the supply-chain model lint-text.yml uses for its
      # manifests, so the script and this workflow always share a commit. A
      # `./` action path would resolve against the caller's checkout
      # instead. The `job` context is only available on steps, so the two
      # values are bound here rather than at job or workflow level. The
      # step carries the shfmt install's condition, so a job that installs
      # nothing never reads the job context.
      - name: Fetch install-pinned-tool
        if: >-
          inputs.run-shfmt
          && steps.find-scripts.outputs.found == 'true'
        env:
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "${REQ_REPO}" ] || [ -z "${REQ_SHA}" ]; then
            msg="job.workflow_repository or job.workflow_sha is unavailable,"
            msg="${msg} so this workflow cannot fetch its pinned installer."
            msg="${msg} Neither is populated on GitHub Enterprise Server; set"
            msg="${msg} run-shfmt: false there, or install shfmt in your own"
            msg="${msg} job with the set-up-shfmt action."
            echo "::error::${msg}" >&2
            exit 1
          fi
          base="https://raw.githubusercontent.com/${REQ_REPO}/${REQ_SHA}"
          echo "Fetching from ${base}"
          curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors \
            "${base}/actions/install-pinned-tool/install-pinned-tool.sh" \
            -o "${RUNNER_TEMP}/install-pinned-tool.sh"

      - name: Install shfmt
        if: >-
          inputs.run-shfmt
          && steps.find-scripts.outputs.found == 'true'
        env:
          TOOL: shfmt
          VERSION: ${{ inputs.shfmt-version }}
          URL_TEMPLATE: https://github.com/mvdan/sh/releases/download/v{version}/shfmt_v{version}_{os}_{arch}
          CHECKSUMS: ${{ inputs.shfmt-checksums }}
        run: bash "${RUNNER_TEMP}/install-pinned-tool.sh"

      - name: Run shfmt check
        if: >-
          inputs.run-shfmt
          && steps.find-scripts.outputs.found == 'true'
        env:
          SHELL_SCRIPTS: ${{ steps.find-scripts.outputs.files }}
        run: |
          echo "${SHELL_SCRIPTS}" | tr '\n' '\0' | xargs -0 shfmt -d
