name: Run Rust CI

on:
  workflow_call:
    inputs:
      rust-version:
        description: >-
          Rust toolchain version to install. When empty, the workflow
          reads the channel from rust-toolchain-file. At least one of
          rust-version or rust-toolchain-file must resolve to a value.
        type: string
        default: ""
      rust-toolchain-file:
        description: >-
          Path to a rust-toolchain.toml (or legacy rust-toolchain) file
          in the consumer repo. Used when rust-version is empty. The
          file's [toolchain] channel value is passed to dtolnay.
        type: string
        default: rust-toolchain.toml
      runs-on:
        description: >-
          Runner label (ubuntu-latest or macos-latest recommended;
          Windows is not supported).
        type: string
        default: ubuntu-latest
      run-test:
        description: Run cargo test.
        type: boolean
        default: true
      use-nextest:
        description: >-
          Use cargo-nextest instead of cargo test. When enabled,
          cargo-nextest is installed from a checksum-verified binary.
        type: boolean
        default: false
      nextest-version:
        description: cargo-nextest version to install.
        type: string
        default: "0.9.145"
      test-args:
        description: >-
          Additional arguments passed to cargo test or cargo nextest run.
        type: string
        default: ""
      run-lint:
        description: Run cargo clippy.
        type: boolean
        default: true
      clippy-args:
        description: >-
          Arguments passed to cargo clippy after the -- separator.
        type: string
        default: "-D warnings"
      run-format-check:
        description: Run cargo fmt --check.
        type: boolean
        default: true
      run-deny:
        description: >-
          Run cargo deny check. Requires a deny.toml configuration file
          in the repository root.
        type: boolean
        default: false
      deny-version:
        description: cargo-deny version to install.
        type: string
        default: "0.20.2"
      run-audit:
        description: Run cargo audit.
        type: boolean
        default: false
      audit-version:
        description: cargo-audit version to install.
        type: string
        default: "0.22.2"
      run-typos:
        description: Run typos spell checking.
        type: boolean
        default: false
      cargo-features:
        description: >-
          Cargo features passed to test and clippy commands via --features.
        type: string
        default: ""
      extra-components:
        description: >-
          Space-separated list of additional rustup components to install
          (e.g. "llvm-tools-preview").
        type: string
        default: ""
      coverage:
        description: Generate coverage and upload to Codecov.
        type: boolean
        default: false
      codecov-cli-version:
        description: Codecov CLI version to install.
        type: string
        default: "11.3.1"
      codecov-files:
        description: Coverage file path (used for llvm-cov output and Codecov upload).
        type: string
        default: lcov.info
      llvm-cov-version:
        description: cargo-llvm-cov version to install.
        type: string
        default: "0.9.1"
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 15
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: inputs.run-test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Rust toolchain
        id: rust-toolchain
        shell: bash
        env:
          RUST_VERSION: ${{ inputs.rust-version }}
          TOOLCHAIN_FILE: ${{ inputs.rust-toolchain-file }}
        run: |
          if [ -n "${RUST_VERSION}" ]; then
            toolchain="${RUST_VERSION}"
          elif [ -f "${TOOLCHAIN_FILE}" ]; then
            toolchain="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' "${TOOLCHAIN_FILE}")"
            if [ -z "${toolchain}" ]; then
              echo "::error::${TOOLCHAIN_FILE} exists but has no [toolchain] channel value." >&2
              exit 1
            fi
          elif [ -f rust-toolchain ]; then
            toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          else
            echo "::error::Set the rust-version input," \
              "ensure the configured rust-toolchain-file ('${TOOLCHAIN_FILE}') exists," \
              "or commit a rust-toolchain file in the consumer repo." >&2
            exit 1
          fi
          echo "toolchain=${toolchain}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-06-30
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
          components: ${{ inputs.coverage && 'llvm-tools-preview' || '' }}

      - name: Install extra components
        if: inputs.extra-components != ''
        shell: bash
        env:
          COMPONENTS: ${{ inputs.extra-components }}
        run: |
          read -r -a components <<< "${COMPONENTS}"
          rustup component add "${components[@]}"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-nextest
        if: inputs.use-nextest
        shell: bash
        env:
          VERSION: ${{ inputs.nextest-version }}
        run: |
          case "$(uname -s)" in
            Linux)
              case "$(uname -m)" in
                x86_64)      target="x86_64-unknown-linux-gnu" ;;
                arm64|aarch64) target="aarch64-unknown-linux-gnu" ;;
                *)
                  echo "Unsupported architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac
              ;;
            Darwin) target="universal-apple-darwin" ;;
            *)
              echo "Unsupported operating system: $(uname -s)" >&2
              exit 1
              ;;
          esac

          archive="cargo-nextest-${VERSION}-${target}.tar.gz"
          base="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${VERSION}"
          install_dir="${RUNNER_TEMP}/nextest-bin"
          mkdir -p "${install_dir}"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -sSfL "${base}/${archive}" -o "${archive_path}"
          curl -sSfL "${base}/cargo-nextest-${VERSION}-${target}.sha256" \
            -o "${RUNNER_TEMP}/nextest-checksum.txt"
          expected="$(awk '{print $1}' "${RUNNER_TEMP}/nextest-checksum.txt")"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${archive_path}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${archive_path}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "Checksum verification failed for ${archive}" >&2
            echo "Expected: ${expected}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          tar -xz -C "${install_dir}" -f "${archive_path}"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Install cargo-llvm-cov
        if: inputs.coverage
        shell: bash
        env:
          VERSION: ${{ inputs.llvm-cov-version }}
        run: |
          case "$(uname -s)" in
            Linux)
              case "$(uname -m)" in
                x86_64)        target="x86_64-unknown-linux-gnu" ;;
                arm64|aarch64) target="aarch64-unknown-linux-gnu" ;;
                *)
                  echo "Unsupported architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac
              ;;
            Darwin)
              case "$(uname -m)" in
                x86_64)        target="x86_64-apple-darwin" ;;
                arm64|aarch64) target="aarch64-apple-darwin" ;;
                *)
                  echo "Unsupported architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unsupported operating system: $(uname -s)" >&2
              exit 1
              ;;
          esac

          # Hardcoded SHA-256 checksums for cargo-llvm-cov v0.9.1 release
          # archives. taiki-e/cargo-llvm-cov upstream does not publish a
          # checksum file, so these are computed from the release artifacts
          # and must be updated when VERSION changes.
          supported_version="0.9.1"
          if [ "${VERSION}" != "${supported_version}" ]; then
            echo "Unsupported cargo-llvm-cov version: ${VERSION}" >&2
            echo "Checksums are only available for v${supported_version}." >&2
            echo "To use a different version, update the checksums in this workflow." >&2
            exit 1
          fi

          case "${target}" in
            x86_64-unknown-linux-gnu)  expected="b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a" ;;
            aarch64-unknown-linux-gnu) expected="abf5f13c1520f8756d2192bfaaeadb0208f5b7eaa8cadc15bf847befa42b7360" ;;
            x86_64-apple-darwin)       expected="ddf949b82a63017441ea76aa068bdd7e2dde8055f47cd3ef736fdbbd633bc33e" ;;
            aarch64-apple-darwin)      expected="7e821a6c90c0884f79f759f5d9be50799ade67bb82515186d922f26032ef43b8" ;;
            *)
              echo "No checksum available for ${target}" >&2
              exit 1
              ;;
          esac

          archive="cargo-llvm-cov-${target}.tar.gz"
          bin_dir="${RUNNER_TEMP}/cargo-llvm-cov-bin"
          mkdir -p "${bin_dir}"
          base="https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${VERSION}"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -sSfL "${base}/${archive}" -o "${archive_path}"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${archive_path}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${archive_path}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "Checksum verification failed for ${archive}" >&2
            echo "Expected: ${expected}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          tar -xz -C "${bin_dir}" -f "${archive_path}" cargo-llvm-cov
          printf '%s\n' "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Run tests
        if: ${{ !inputs.coverage }}
        shell: bash
        env:
          USE_NEXTEST: ${{ inputs.use-nextest }}
          TEST_ARGS: ${{ inputs.test-args }}
          CARGO_FEATURES: ${{ inputs.cargo-features }}
        run: |
          if [ "${USE_NEXTEST}" = "true" ]; then
            args=(cargo nextest run)
          else
            args=(cargo test)
          fi
          if [ -n "${CARGO_FEATURES}" ]; then
            args+=(--features "${CARGO_FEATURES}")
          fi
          if [ -n "${TEST_ARGS}" ]; then
            read -r -a extra <<< "${TEST_ARGS}"
            args+=("${extra[@]}")
          fi
          "${args[@]}"

      - name: Run tests with coverage
        if: inputs.coverage
        shell: bash
        env:
          USE_NEXTEST: ${{ inputs.use-nextest }}
          CARGO_FEATURES: ${{ inputs.cargo-features }}
          CODECOV_FILE: ${{ inputs.codecov-files }}
          TEST_ARGS: ${{ inputs.test-args }}
        run: |
          if [ "${USE_NEXTEST}" = "true" ]; then
            args=(cargo llvm-cov nextest --lcov --output-path "${CODECOV_FILE}")
          else
            args=(cargo llvm-cov --lcov --output-path "${CODECOV_FILE}")
          fi
          if [ -n "${CARGO_FEATURES}" ]; then
            args+=(--features "${CARGO_FEATURES}")
          fi
          if [ -n "${TEST_ARGS}" ]; then
            read -r -a extra <<< "${TEST_ARGS}"
            args+=("${extra[@]}")
          fi
          "${args[@]}"

      - name: Upload coverage to Codecov
        if: inputs.coverage
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          CODECOV_CLI_VERSION: ${{ inputs.codecov-cli-version }}
        run: |
          # Unset empty token so the CLI uses tokenless mode for public repos
          # instead of treating the empty string as an invalid token.
          if [ -z "${CODECOV_TOKEN}" ]; then
            unset CODECOV_TOKEN
          fi

          case "${RUNNER_OS}" in
            Linux) codecov_os="linux" ;;
            macOS) codecov_os="macos" ;;
            *)
              echo "Unsupported runner operating system: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

          codecov_bin="${RUNNER_TEMP}/codecov"
          base_url="https://cli.codecov.io/v${CODECOV_CLI_VERSION}/${codecov_os}"
          curl -sSfL "${base_url}/codecov" -o "${codecov_bin}"
          curl -sSfL "${base_url}/codecov.SHA256SUM" -o "${codecov_bin}.sha256"
          expected="$(awk '{print $1}' "${codecov_bin}.sha256")"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${codecov_bin}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${codecov_bin}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "Checksum verification failed for codecov" >&2
            echo "Expected: ${expected}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          chmod +x "${codecov_bin}"
          "${codecov_bin}" upload-process \
            --file "${{ inputs.codecov-files }}" \
            --disable-search

  lint:
    name: Lint
    if: inputs.run-lint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Rust toolchain
        id: rust-toolchain
        shell: bash
        env:
          RUST_VERSION: ${{ inputs.rust-version }}
          TOOLCHAIN_FILE: ${{ inputs.rust-toolchain-file }}
        run: |
          if [ -n "${RUST_VERSION}" ]; then
            toolchain="${RUST_VERSION}"
          elif [ -f "${TOOLCHAIN_FILE}" ]; then
            toolchain="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' "${TOOLCHAIN_FILE}")"
            if [ -z "${toolchain}" ]; then
              echo "::error::${TOOLCHAIN_FILE} exists but has no [toolchain] channel value." >&2
              exit 1
            fi
          elif [ -f rust-toolchain ]; then
            toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          else
            echo "::error::Set the rust-version input," \
              "ensure the configured rust-toolchain-file ('${TOOLCHAIN_FILE}') exists," \
              "or commit a rust-toolchain file in the consumer repo." >&2
            exit 1
          fi
          echo "toolchain=${toolchain}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-06-30
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run clippy
        shell: bash
        env:
          CLIPPY_ARGS: ${{ inputs.clippy-args }}
          CARGO_FEATURES: ${{ inputs.cargo-features }}
        run: |
          args=(cargo clippy --all-targets)
          if [ -n "${CARGO_FEATURES}" ]; then
            args+=(--features "${CARGO_FEATURES}")
          fi
          args+=(--)
          if [ -n "${CLIPPY_ARGS}" ]; then
            read -r -a extra <<< "${CLIPPY_ARGS}"
            args+=("${extra[@]}")
          fi
          "${args[@]}"

  format-check:
    name: Format check
    if: inputs.run-format-check
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Rust toolchain
        id: rust-toolchain
        shell: bash
        env:
          RUST_VERSION: ${{ inputs.rust-version }}
          TOOLCHAIN_FILE: ${{ inputs.rust-toolchain-file }}
        run: |
          if [ -n "${RUST_VERSION}" ]; then
            toolchain="${RUST_VERSION}"
          elif [ -f "${TOOLCHAIN_FILE}" ]; then
            toolchain="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' "${TOOLCHAIN_FILE}")"
            if [ -z "${toolchain}" ]; then
              echo "::error::${TOOLCHAIN_FILE} exists but has no [toolchain] channel value." >&2
              exit 1
            fi
          elif [ -f rust-toolchain ]; then
            toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          else
            echo "::error::Set the rust-version input," \
              "ensure the configured rust-toolchain-file ('${TOOLCHAIN_FILE}') exists," \
              "or commit a rust-toolchain file in the consumer repo." >&2
            exit 1
          fi
          echo "toolchain=${toolchain}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-06-30
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  deny:
    name: Deny
    if: inputs.run-deny
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Rust toolchain
        id: rust-toolchain
        shell: bash
        env:
          RUST_VERSION: ${{ inputs.rust-version }}
          TOOLCHAIN_FILE: ${{ inputs.rust-toolchain-file }}
        run: |
          if [ -n "${RUST_VERSION}" ]; then
            toolchain="${RUST_VERSION}"
          elif [ -f "${TOOLCHAIN_FILE}" ]; then
            toolchain="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' "${TOOLCHAIN_FILE}")"
            if [ -z "${toolchain}" ]; then
              echo "::error::${TOOLCHAIN_FILE} exists but has no [toolchain] channel value." >&2
              exit 1
            fi
          elif [ -f rust-toolchain ]; then
            toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          else
            echo "::error::Set the rust-version input," \
              "ensure the configured rust-toolchain-file ('${TOOLCHAIN_FILE}') exists," \
              "or commit a rust-toolchain file in the consumer repo." >&2
            exit 1
          fi
          echo "toolchain=${toolchain}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-06-30
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}

      - name: Install cargo-deny
        shell: bash
        env:
          VERSION: ${{ inputs.deny-version }}
        run: |
          case "$(uname -s)" in
            Linux)
              case "$(uname -m)" in
                x86_64)        target="x86_64-unknown-linux-musl" ;;
                arm64|aarch64) target="aarch64-unknown-linux-musl" ;;
                *)
                  echo "Unsupported architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac
              ;;
            Darwin)
              case "$(uname -m)" in
                x86_64)        target="x86_64-apple-darwin" ;;
                arm64|aarch64) target="aarch64-apple-darwin" ;;
                *)
                  echo "Unsupported architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unsupported operating system: $(uname -s)" >&2
              exit 1
              ;;
          esac

          archive="cargo-deny-${VERSION}-${target}.tar.gz"
          bin_dir="${RUNNER_TEMP}/cargo-deny-bin"
          mkdir -p "${bin_dir}"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${VERSION}"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -sSfL "${base}/${archive}" -o "${archive_path}"
          curl -sSfL "${base}/${archive}.sha256" \
            -o "${RUNNER_TEMP}/deny-checksum.txt"
          expected="$(tr -d '[:space:]' < "${RUNNER_TEMP}/deny-checksum.txt")"
          if [ -z "${expected}" ]; then
            echo "Checksum file is empty for ${archive}" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${archive_path}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${archive_path}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "Checksum verification failed for ${archive}" >&2
            echo "Expected: ${expected}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          tar -xz -C "${RUNNER_TEMP}" -f "${archive_path}"
          install -m 0755 \
            "${RUNNER_TEMP}/cargo-deny-${VERSION}-${target}/cargo-deny" \
            "${bin_dir}/cargo-deny"
          printf '%s\n' "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Run deny
        run: cargo deny check

  audit:
    name: Audit
    if: inputs.run-audit
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Rust toolchain
        id: rust-toolchain
        shell: bash
        env:
          RUST_VERSION: ${{ inputs.rust-version }}
          TOOLCHAIN_FILE: ${{ inputs.rust-toolchain-file }}
        run: |
          if [ -n "${RUST_VERSION}" ]; then
            toolchain="${RUST_VERSION}"
          elif [ -f "${TOOLCHAIN_FILE}" ]; then
            toolchain="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' "${TOOLCHAIN_FILE}")"
            if [ -z "${toolchain}" ]; then
              echo "::error::${TOOLCHAIN_FILE} exists but has no [toolchain] channel value." >&2
              exit 1
            fi
          elif [ -f rust-toolchain ]; then
            toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          else
            echo "::error::Set the rust-version input," \
              "ensure the configured rust-toolchain-file ('${TOOLCHAIN_FILE}') exists," \
              "or commit a rust-toolchain file in the consumer repo." >&2
            exit 1
          fi
          echo "toolchain=${toolchain}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-06-30
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}

      - name: Install cargo-audit
        shell: bash
        env:
          VERSION: ${{ inputs.audit-version }}
        run: |
          case "$(uname -s)" in
            Linux)
              case "$(uname -m)" in
                x86_64)        target="x86_64-unknown-linux-gnu" ;;
                arm64|aarch64) target="aarch64-unknown-linux-gnu" ;;
                *)
                  echo "Unsupported architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac
              ;;
            Darwin)
              case "$(uname -m)" in
                x86_64)        target="x86_64-apple-darwin" ;;
                arm64|aarch64) target="aarch64-apple-darwin" ;;
                *)
                  echo "Unsupported architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unsupported operating system: $(uname -s)" >&2
              exit 1
              ;;
          esac

          # Hardcoded SHA-256 checksums for cargo-audit v0.22.2 release
          # archives. cargo-audit upstream does not publish checksum files,
          # so these are computed from the release artifacts and must be
          # updated when VERSION changes.
          supported_version="0.22.2"
          if [ "${VERSION}" != "${supported_version}" ]; then
            echo "Unsupported cargo-audit version: ${VERSION}" >&2
            echo "Checksums are only available for v${supported_version}." >&2
            echo "To use a different version, update the checksums in this workflow." >&2
            exit 1
          fi

          case "${target}" in
            x86_64-unknown-linux-gnu)  expected="ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39" ;;
            aarch64-unknown-linux-gnu) expected="c6603814ddaa45e51263dafd31c0ac98808f688d26f7395804f9670b0fd599dd" ;;
            x86_64-apple-darwin)       expected="847831323de932155b226ab60ee4a180e13e5d007a019f0d4b7b4d89a6de2ab2" ;;
            aarch64-apple-darwin)      expected="ec7ca4263769593df4d909be85b94a6b79efa2897be5d2bb8ebd516e823175af" ;;
            *)
              echo "No checksum available for ${target}" >&2
              exit 1
              ;;
          esac

          archive="cargo-audit-${target}-v${VERSION}.tgz"
          bin_dir="${RUNNER_TEMP}/cargo-audit-bin"
          mkdir -p "${bin_dir}"
          base="https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${VERSION}"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -sSfL "${base}/${archive}" -o "${archive_path}"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${archive_path}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${archive_path}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "Checksum verification failed for ${archive}" >&2
            echo "Expected: ${expected}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          tar -xz -C "${RUNNER_TEMP}" -f "${archive_path}"
          install -m 0755 \
            "${RUNNER_TEMP}/cargo-audit-${target}-v${VERSION}/cargo-audit" \
            "${bin_dir}/cargo-audit"
          printf '%s\n' "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Run audit
        run: cargo audit

  typos:
    name: Typos
    if: inputs.run-typos
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
