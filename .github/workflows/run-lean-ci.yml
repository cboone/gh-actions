name: Run Lean CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label (ubuntu-latest or macos-latest recommended;
          Windows is not supported).
        type: string
        default: ubuntu-latest
      run-build:
        description: Run lake build via lean-action.
        type: boolean
        default: true
      run-lint:
        description: Run lake lint after the build.
        type: boolean
        default: true
      run-test:
        description: Run lake test after the build.
        type: boolean
        default: true
      use-mathlib-cache:
        description: >-
          Controls lean-action's `lake exe cache get` step for the
          Mathlib build cache. Allowed values: "auto", "true", "false".
          "auto" lets lean-action detect a Mathlib dependency.
        type: string
        default: auto
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 30

permissions:
  contents: read

jobs:
  lean:
    name: Lean
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache elan toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}

      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          build: ${{ inputs.run-build && 'true' || 'false' }}
          test: "false"
          lint: "false"
          use-mathlib-cache: ${{ inputs.use-mathlib-cache }}

      - name: Run lake lint
        if: inputs.run-lint
        run: lake lint

      - name: Run lake test
        if: inputs.run-test
        run: lake test
