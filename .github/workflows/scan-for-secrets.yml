name: Scan for secrets

on:
  workflow_call:
    inputs:
      tool:
        description: >-
          Which tool to run: gitleaks, trufflehog, or both.
        type: string
        default: gitleaks
      scan-scope:
        description: >-
          Scan scope: full-history or working-tree.
        type: string
        default: full-history
      gitleaks-version:
        description: gitleaks version to install.
        type: string
        default: "8.30.1"
      trufflehog-version:
        description: trufflehog version to install.
        type: string
        default: "3.97.5"
      fetch-depth:
        description: >-
          Git fetch depth. Set to 0 for full history (default for
          full-history scans), 1 for working-tree only scans.
        type: number
        default: 0
      allowlist-config:
        description: >-
          Path to a gitleaks config file, relative to the repository root.
          On pull_request, read it from the base revision; when unset, use
          the base's .gitleaks.toml or default rules. Config changes apply
          after merge; .gitleaksignore also comes from the base. gitleaks only.
        type: string
        default: ""
      trufflehog-allowlist:
        description: >-
          Path to a JSON allowlist of reviewed trufflehog findings, relative
          to the checkout. Each entry names a commit, path, line and
          detector, and matches only that finding. Leave unset to fail on
          every finding.
        type: string
        default: ""
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 15

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Validate inputs
        shell: bash
        env:
          TOOL: ${{ inputs.tool }}
          SCAN_SCOPE: ${{ inputs.scan-scope }}
        run: |
          case "${TOOL}" in
            gitleaks|trufflehog|both) ;;
            *)
              echo "Invalid 'tool' input: '${TOOL}'. Expected 'gitleaks', 'trufflehog', or 'both'." >&2
              exit 1
              ;;
          esac
          case "${SCAN_SCOPE}" in
            full-history|working-tree) ;;
            *)
              echo "Invalid 'scan-scope' input: '${SCAN_SCOPE}'. Expected 'full-history' or 'working-tree'." >&2
              exit 1
              ;;
          esac

  gitleaks:
    name: gitleaks
    needs: validate-inputs
    if: inputs.tool == 'gitleaks' || inputs.tool == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: >-
            ${{
              (inputs.scan-scope == 'working-tree' && 1)
              || inputs.fetch-depth
            }}
          persist-credentials: false
          path: gitleaks-source

      - name: Check out trusted gitleaks configuration
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: gitleaks-base

      - name: Validate trusted gitleaks helper context
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ -z "${REQ_REPO}" || -z "${REQ_SHA}" ]]; then
            message="Trusted gitleaks PR scans require job.workflow_repository and job.workflow_sha;"
            message="${message} unavailable on GitHub Enterprise Server."
            echo "::error::${message}" >&2
            exit 1
          fi

      - name: Check out trusted gitleaks helpers
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: gitleaks-tools

      - name: Set up uv for trusted config preparation
        if: github.event_name == 'pull_request'
        uses: ./gitleaks-tools/actions/set-up-uv

      - name: Install gitleaks
        shell: bash
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          case "$(uname -s)" in
            Linux) os="linux" ;;
            Darwin) os="darwin" ;;
            *)
              echo "Unsupported operating system: $(uname -s)" >&2
              exit 1
              ;;
          esac

          case "$(uname -m)" in
            x86_64) arch="x64" ;;
            arm64|aarch64) arch="arm64" ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${install_dir}"
          base="https://github.com/gitleaks/gitleaks/releases/download"
          archive="gitleaks_${VERSION}_${os}_${arch}.tar.gz"
          archive_path="${install_dir}/${archive}"
          curl -sSfL "${base}/v${VERSION}/${archive}" -o "${archive_path}"
          curl -sSfL "${base}/v${VERSION}/gitleaks_${VERSION}_checksums.txt" \
            -o "${install_dir}/checksums.txt"
          expected="$(grep -F "${archive}" "${install_dir}/checksums.txt" | head -1 | awk '{print $1}')"
          if [ -z "${expected}" ]; then
            echo "Checksum entry not found for ${archive}" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${archive_path}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${archive_path}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "Checksum verification failed for ${archive}" >&2
            echo "Expected: ${expected}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          tar -xz -C "${install_dir}" -f "${archive_path}" gitleaks
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Run gitleaks
        shell: bash
        working-directory: gitleaks-source
        env:
          SCAN_SCOPE: ${{ inputs.scan-scope }}
          ALLOWLIST_CONFIG: ${{ inputs.allowlist-config }}
          EVENT_NAME: ${{ github.event_name }}
          PREPARE_CONFIG: ${{ github.workspace }}/gitleaks-tools/scripts/prepare-gitleaks-config.py
        run: |
          # A subshell keeps this cleanup separate from the trusted-ignore trap.
          function scan() (
            set +x
            umask 077
            local scan_dir report diagnostics status=0
            scan_dir="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/gitleaks-scan.XXXXXX")"
            report="${scan_dir}/findings.json"
            diagnostics="${scan_dir}/stderr"
            trap 'rm -f -- "${report}" "${diagnostics}" && rmdir -- "${scan_dir}"' EXIT
            # Verbose output can expose values from required rules even with redaction.
            # Keep both scanner streams private and print only finding metadata.
            gitleaks "$@" --redact=100 --exit-code 10 --report-format json --report-path - \
              >"${report}" 2>"${diagnostics}" || status=$?
            if [[ "${status}" -eq 0 || "${status}" -eq 10 || -s "${report}" ]] &&
              ! jq -sr --arg status "${status}" '
              if length != 1 or (.[0] | type) != "array" then error("invalid report")
              else .[0] end
              | if all(.[]; (.Fingerprint | type) == "string" and (.File | type) == "string"
                  and (.StartLine | type) == "number" and (.RuleID | type) == "string") then .
                else error("invalid finding") end
              | if ($status == "0" and length > 0) or ($status == "10" and length == 0)
                  then error("inconsistent report")
                elif length == 0 and $status == "0" then "no leaks found"
                elif length > 0 then (
                  .[] | "fingerprint=\(.Fingerprint | tojson) file=\(.File | tojson)"
                    + " line=\(.StartLine | tojson) rule=\(.RuleID | tojson)"
                ), "leaks found: \(length)" else empty end
            ' "${report}" 2>/dev/null; then
              echo "::error::gitleaks did not produce a usable findings report (exit ${status})." >&2
              if [[ "${status}" -eq 0 || "${status}" -eq 10 ]]; then
                return 1
              fi
            fi
            case "${status}" in
              0) return 0 ;;
              10) return 1 ;;
              *)
                echo "::error::gitleaks could not complete the scan (exit ${status})." >&2
                return "${status}"
                ;;
            esac
          )

          args=(detect --source .)
          if [ "${SCAN_SCOPE}" = "working-tree" ]; then
            args+=(--no-git)
          fi
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            trusted_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks-config.XXXXXX")"
            uv run --no-project --no-python-downloads --script "${PREPARE_CONFIG}" \
              --base "${GITHUB_WORKSPACE}/gitleaks-base" \
              --config "${ALLOWLIST_CONFIG}" --output "${trusted_dir}"
            trusted_args=(--config "${trusted_dir}/config-0.toml" \
              --gitleaks-ignore-path "${trusted_dir}/.gitleaksignore")
            args+=("${trusted_args[@]}")
            # Gitleaks also loads source/.gitleaksignore even with an explicit path.
            # Preserve it outside the source during scanning, then restore it.
            ignore_saved=false
            trap 'if ${ignore_saved}; then mv -- "${trusted_dir}/proposed-ignore" .gitleaksignore; fi' EXIT
            if [[ -f .gitleaksignore || -L .gitleaksignore ]]; then
              if [[ "${SCAN_SCOPE}" = "working-tree" && ! -L .gitleaksignore ]]; then
                scan detect --source .gitleaksignore --no-git "${trusted_args[@]}"
              fi
              mv -- .gitleaksignore "${trusted_dir}/proposed-ignore"
              ignore_saved=true
            fi
          elif [ -n "${ALLOWLIST_CONFIG}" ]; then
            args+=(--config "${ALLOWLIST_CONFIG}")
          fi
          scan "${args[@]}"

  trufflehog:
    name: trufflehog
    needs: validate-inputs
    if: inputs.tool == 'trufflehog' || inputs.tool == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: >-
            ${{
              (inputs.scan-scope == 'working-tree' && 1)
              || inputs.fetch-depth
            }}
          persist-credentials: false

      - name: Install trufflehog
        shell: bash
        env:
          VERSION: ${{ inputs.trufflehog-version }}
        run: |
          case "$(uname -s)" in
            Linux) os="linux" ;;
            Darwin) os="darwin" ;;
            *)
              echo "Unsupported operating system: $(uname -s)" >&2
              exit 1
              ;;
          esac

          case "$(uname -m)" in
            x86_64) arch="amd64" ;;
            arm64|aarch64) arch="arm64" ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          install_dir="${RUNNER_TEMP}/trufflehog-bin"
          mkdir -p "${install_dir}"
          base="https://github.com/trufflesecurity/trufflehog/releases/download"
          archive="trufflehog_${VERSION}_${os}_${arch}.tar.gz"
          archive_path="${install_dir}/${archive}"
          curl -sSfL "${base}/v${VERSION}/${archive}" -o "${archive_path}"
          curl -sSfL "${base}/v${VERSION}/trufflehog_${VERSION}_checksums.txt" \
            -o "${install_dir}/checksums.txt"
          expected="$(grep -F "${archive}" "${install_dir}/checksums.txt" | head -1 | awk '{print $1}')"
          if [ -z "${expected}" ]; then
            echo "Checksum entry not found for ${archive}" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${archive_path}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${archive_path}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "Checksum verification failed for ${archive}" >&2
            echo "Expected: ${expected}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          tar -xz -C "${install_dir}" -f "${archive_path}" trufflehog
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Fetch allowlist checker
        shell: bash
        env:
          # Pin the checker to the repository and commit this workflow file
          # itself came from. `github.*` describes the caller, so github.sha
          # would be the caller's commit and 404 on raw.githubusercontent.com.
          # Neither value can be hoisted into a job-level or workflow-level
          # `env:` block: the `job` context is only available on steps.
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
          TRUFFLEHOG_ALLOWLIST: ${{ inputs.trufflehog-allowlist }}
        run: |
          # Encode a workflow-command annotation's data, mirroring the helper
          # in install-pinned-tool.sh. The path below is caller-supplied, and
          # a CR or LF in it would otherwise start a line the runner reads as
          # another workflow command.
          escape_data() {
            local text="${1}"
            local percent='%'
            local cr=$'\r'
            local lf=$'\n'
            text="${text//"${percent}"/%25}"
            text="${text//"${cr}"/%0D}"
            text="${text//"${lf}"/%0A}"
            printf '%s' "${text}"
          }
          if [ -z "${REQ_REPO}" ] || [ -z "${REQ_SHA}" ]; then
            msg="job.workflow_repository or job.workflow_sha is unavailable,"
            msg="${msg} so this workflow cannot fetch its own allowlist"
            msg="${msg} checker. Neither is populated on GitHub Enterprise"
            msg="${msg} Server. On that server, use the run-trufflehog"
            msg="${msg} action with a reviewed allowlist."
            echo "::error::${msg}" >&2
            exit 1
          fi
          if [[ -n "${TRUFFLEHOG_ALLOWLIST}" && ! -f "${TRUFFLEHOG_ALLOWLIST}" ]]; then
            msg="trufflehog-allowlist '${TRUFFLEHOG_ALLOWLIST}' is not a file"
            msg="${msg} in the checkout."
            printf '::error::%s\n' "$(escape_data "${msg}")" >&2
            exit 1
          fi
          # jq comes from the runner image and is required on both paths.
          if ! command -v jq > /dev/null 2>&1; then
            echo "::error::jq is required to report TruffleHog findings and is not on PATH." >&2
            exit 1
          fi
          install_dir="${RUNNER_TEMP}/trufflehog-allowlist"
          mkdir -p "${install_dir}"
          base="https://raw.githubusercontent.com/${REQ_REPO}/${REQ_SHA}/actions/run-trufflehog"
          echo "Fetching from ${base}"
          curl -sSfL --proto '=https' --retry 3 --retry-delay 5 --retry-all-errors \
            "${base}/check-allowlist.sh" -o "${install_dir}/check-allowlist.sh"
          curl -sSfL --proto '=https' --retry 3 --retry-delay 5 --retry-all-errors \
            "${base}/check-allowlist.jq" -o "${install_dir}/check-allowlist.jq"
          chmod +x "${install_dir}/check-allowlist.sh"
          printf 'ALLOWLIST_CHECKER=%s\n' "${install_dir}/check-allowlist.sh" >> "${GITHUB_ENV}"

      - name: Run trufflehog
        shell: bash
        env:
          SCAN_SCOPE: ${{ inputs.scan-scope }}
          TRUFFLEHOG_ALLOWLIST: ${{ inputs.trufflehog-allowlist }}
        run: |
          set +x
          umask 077
          args=(git file://.)
          if [ "${SCAN_SCOPE}" = "working-tree" ]; then
            args=(filesystem --directory .)
          fi
          # Exclude unverified results to limit noise from invalid credentials.
          # Verification errors remain visible through unknown results.
          # Keep the checksum-verified version instead of updating during the scan.
          # Scanner output on either stream can contain credential material.
          scan_dir="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/trufflehog-scan.XXXXXX")"
          findings="${scan_dir}/findings.json"
          diagnostics="${scan_dir}/stderr"
          trap 'rm -f -- "${findings}" "${diagnostics}" && rmdir -- "${scan_dir}"' EXIT
          status=0
          trufflehog "${args[@]}" --no-update --results=verified,unknown --fail \
            --json > "${findings}" 2> "${diagnostics}" || status=$?
          checker_args=(--findings "${findings}")
          if [[ -n "${TRUFFLEHOG_ALLOWLIST}" ]]; then
            checker_args+=(--allowlist "${TRUFFLEHOG_ALLOWLIST}")
          fi
          if [[ "${status}" -eq 183 ]]; then
            # Tell the checker results were reported, so a findings file it
            # cannot read fails instead of reading as a clean scan.
            checker_args+=(--expect-findings)
          fi
          checker_status=0
          if [[ "${status}" -eq 0 || "${status}" -eq 183 || -s "${findings}" ]]; then
            "${ALLOWLIST_CHECKER}" "${checker_args[@]}" || checker_status=$?
          fi
          if [[ "${status}" -ne 0 && "${status}" -ne 183 ]]; then
            echo "::error::trufflehog could not complete the scan (exit ${status})." >&2
            exit "${status}"
          fi
          if [[ -z "${TRUFFLEHOG_ALLOWLIST}" && "${checker_status}" -eq 1 ]]; then
            if [[ "${status}" -eq 183 ]]; then
              exit "${status}"
            fi
            echo "::error::TruffleHog wrote findings but did not return its findings exit status." >&2
            exit 2
          fi
          exit "${checker_status}"
