name: Lint text

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to install.
        type: string
        default: "24.21.0"
      run-markdownlint:
        description: Run markdownlint-cli2.
        type: boolean
        default: true
      run-prettier:
        description: Run Prettier format check.
        type: boolean
        default: true
      run-cspell:
        description: Run cspell spell checker.
        type: boolean
        default: false
      run-yamllint:
        description: Run yamllint.
        type: boolean
        default: false
      preset:
        description: |
          Optional preset config bundle. When set, the named preset
          supplies markdownlint-cli2 and cspell configs for tools that
          don't already have a config in the consumer repo. A local
          consumer config always takes precedence over the preset.
          Valid values: "" (default; no preset), "lean-math"
          (Pandoc-flavored academic Markdown with LaTeX-math cspell
          ignores).
        type: string
        default: ""
      use-consumer-versions:
        description: |
          When true, install markdownlint-cli2, Prettier, and cspell
          from the consumer repo's own package.json + package-lock.json
          (via `npm ci` in the workspace) instead of the versions
          pinned in this gh-actions repo. Use this when local linting
          and CI must agree on tool versions. The consumer is then
          responsible for their lockfile's integrity: a committed
          package-lock.json with sha512 integrity hashes is required,
          and every enabled tool must be present in package-lock.json
          (typically declared as a devDependency in package.json).
          yamllint is unaffected (Python, not npm).
        type: boolean
        default: false
      extra-cspell-packages:
        description: |
          Extra cspell dictionary packages to install, one
          `<name>@<version>  sha512-<base64>` entry per line. cspell
          bundles English-family dictionaries and a few technical ones,
          so any other natural language needs a package it does not
          ship. The version must be exact and the sha512 is required:
          get it from `npm view <name>@<version> dist.integrity`. The
          packages install beside cspell, wherever this workflow put it,
          so a consumer's own config keeps the idiomatic
          `"import": ["@cspell/dict-pt-pt/cspell-ext.json"]`. Ignored
          when run-cspell is false.
        type: string
        default: ""
      cspell-config:
        description: |
          Path to a cspell config file, passed as `--config`. When
          empty, cspell auto-discovers `cspell.json` / `.cspell.json` /
          `cspell.config.*` from the working tree. Setting this
          suppresses the cspell half of `preset`, since an explicit
          config is the strongest form of a consumer config. Ignored
          when run-cspell is false.
        type: string
        default: ""
      cspell-files:
        description: |
          Files and globs for cspell to check, one per line. Defaults to
          the whole workspace. Ignored when run-cspell is false.
        type: string
        default: "."
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 10

permissions:
  contents: read

env:
  UV_VERSION: 0.12.17
  # markdownlint-cli2, prettier, cspell are pinned in this repo's
  # package-lock.json with per-package sha512 integrity hashes; bump
  # them by editing package.json and running `npm install`.
  # yamllint is pinned in requirements/yamllint.txt with hashes; bump
  # both together.

jobs:
  text-lint:
    name: Text lint
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Validate preset input
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          case "${PRESET}" in
            "" | lean-math) ;;
            *)
              echo "::error::Unknown preset '${PRESET}'. Valid values: '' or 'lean-math'." >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      # Fetch preset configs from the workflow's own repository and
      # commit (same supply-chain model as the npm and yamllint installs
      # below). Each preset config is written into the workspace only
      # when the corresponding tool is enabled and the consumer does not
      # already ship a local config, so a local config always wins and
      # disabled tools never trigger a fetch. Auto-discovery picks up the
      # dropped-in file naturally; this keeps relative paths in the
      # preset config (e.g. `./cspell-words.txt`, `references/**`)
      # resolving against the workspace. The local-config check runs
      # before the job-context check so a consumer that ships its own
      # config never depends on a value it does not need.
      - name: Apply markdownlint preset
        if: inputs.preset != '' && inputs.run-markdownlint
        env:
          PRESET: ${{ inputs.preset }}
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
        run: |
          has_local_md=0
          for f in .markdownlint-cli2.jsonc .markdownlint-cli2.yaml \
                   .markdownlint-cli2.cjs .markdownlint-cli2.mjs \
                   .markdownlint.jsonc .markdownlint.json \
                   .markdownlint.yaml .markdownlint.yml \
                   .markdownlint.cjs .markdownlint.mjs; do
            if [ -e "${f}" ]; then
              has_local_md=1
              break
            fi
          done
          if [ "${has_local_md}" -ne 0 ]; then
            echo "Local markdownlint config detected; skipping preset."
            exit 0
          fi
          if [ -z "${REQ_REPO}" ] || [ -z "${REQ_SHA}" ]; then
            msg="job.workflow_repository or job.workflow_sha is unavailable,"
            msg="${msg} so the ${PRESET} preset cannot be fetched. Neither is"
            msg="${msg} populated on GitHub Enterprise Server; ship a local"
            msg="${msg} markdownlint config instead."
            echo "::error::${msg}" >&2
            exit 1
          fi
          base="https://raw.githubusercontent.com/${REQ_REPO}/${REQ_SHA}/presets/${PRESET}"
          echo "Fetching from ${base}"
          curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors \
            "${base}/.markdownlint-cli2.jsonc" \
            -o ".markdownlint-cli2.jsonc"
          echo "Applied ${PRESET} markdownlint preset."

      - name: Apply cspell preset
        if: inputs.preset != '' && inputs.run-cspell
        env:
          PRESET: ${{ inputs.preset }}
          CSPELL_CONFIG: ${{ inputs.cspell-config }}
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
        run: |
          # An explicit --config is the strongest form of "the consumer
          # has its own config", and it would override a dropped-in
          # preset anyway, so defer to it before fetching anything.
          if [ -n "${CSPELL_CONFIG}" ]; then
            echo "Explicit cspell-config set; skipping preset."
            exit 0
          fi
          has_local_cspell=0
          for f in cspell.json cspell.jsonc \
                   cspell.config.json cspell.config.jsonc \
                   cspell.config.yaml cspell.config.yml \
                   cspell.config.js cspell.config.cjs cspell.config.mjs \
                   cspell.yaml cspell.yml \
                   .cspell.json .cspell.jsonc; do
            if [ -e "${f}" ]; then
              has_local_cspell=1
              break
            fi
          done
          if [ "${has_local_cspell}" -ne 0 ]; then
            echo "Local cspell config detected; skipping preset."
            exit 0
          fi
          if [ -z "${REQ_REPO}" ] || [ -z "${REQ_SHA}" ]; then
            msg="job.workflow_repository or job.workflow_sha is unavailable,"
            msg="${msg} so the ${PRESET} preset cannot be fetched. Neither is"
            msg="${msg} populated on GitHub Enterprise Server; ship a local"
            msg="${msg} cspell config instead."
            echo "::error::${msg}" >&2
            exit 1
          fi
          base="https://raw.githubusercontent.com/${REQ_REPO}/${REQ_SHA}/presets/${PRESET}"
          echo "Fetching from ${base}"
          curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors \
            "${base}/cspell.jsonc" -o "cspell.jsonc"
          echo "Applied ${PRESET} cspell preset."

      - name: Install lint tools (sha512-verified via gh-actions lockfile)
        if: >-
          ${{ !inputs.use-consumer-versions
          && (inputs.run-markdownlint || inputs.run-prettier || inputs.run-cspell) }}
        env:
          # Pin package.json + package-lock.json to the repository and
          # commit this workflow file itself came from, so a tampered
          # registry response cannot slip past npm ci's per-package
          # integrity check. The `job` context carries that identity;
          # `github.*` describes the caller, so github.sha would be the
          # caller's commit and 404 on raw.githubusercontent.com. These
          # two values cannot be hoisted into a job-level or
          # workflow-level `env:` block: the `job` context is only
          # available on steps.
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "${REQ_REPO}" ] || [ -z "${REQ_SHA}" ]; then
            msg="job.workflow_repository or job.workflow_sha is unavailable,"
            msg="${msg} so this workflow cannot fetch its own pinned"
            msg="${msg} manifests. Neither is populated on GitHub Enterprise"
            msg="${msg} Server. Set use-consumer-versions: true to install"
            msg="${msg} from your own committed package-lock.json instead."
            echo "::error::${msg}" >&2
            exit 1
          fi
          install_dir="${RUNNER_TEMP}/lint-text-tools"
          mkdir -p "${install_dir}"
          base="https://raw.githubusercontent.com/${REQ_REPO}/${REQ_SHA}"
          echo "Fetching from ${base}"
          curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors \
            "${base}/package.json" -o "${install_dir}/package.json"
          curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors \
            "${base}/package-lock.json" -o "${install_dir}/package-lock.json"
          (cd "${install_dir}" && npm ci --ignore-scripts --include=dev --no-audit --no-fund)
          printf '%s\n' "${install_dir}/node_modules/.bin" >> "${GITHUB_PATH}"
          # Publish where cspell landed, so the dictionary step below
          # installs beside it without a second copy of this path.
          printf 'CSPELL_INSTALL_DIR=%s\n' "${install_dir}" >> "${GITHUB_ENV}"

      - name: Install lint tools (consumer's package-lock.json)
        if: ${{ inputs.use-consumer-versions && (inputs.run-markdownlint || inputs.run-prettier || inputs.run-cspell) }}
        # Install from the consumer's own committed package-lock.json
        # rather than this repo's lockfile. npm ci still enforces
        # per-package sha512 integrity, so the trust boundary becomes
        # the consumer's reviewed lockfile rather than this gh-actions
        # repo. The consumer is responsible for committing
        # package-lock.json with every enabled tool present (typically
        # as a devDependency in package.json).
        run: |
          if [ ! -f package.json ]; then
            echo "::error::use-consumer-versions=true but package.json is missing in the consumer repo." >&2
            exit 1
          fi
          if [ ! -f package-lock.json ]; then
            msg="use-consumer-versions=true but package-lock.json is missing in the consumer repo."
            msg="${msg} Run 'npm install' locally and commit the lockfile."
            echo "::error::${msg}" >&2
            exit 1
          fi
          npm ci --ignore-scripts --include=dev --no-audit --no-fund
          printf '%s\n' "${GITHUB_WORKSPACE}/node_modules/.bin" >> "${GITHUB_PATH}"
          printf 'CSPELL_INSTALL_DIR=%s\n' "${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"

      - name: Validate consumer-installed lint tools
        if: >-
          ${{ inputs.use-consumer-versions
          && (inputs.run-markdownlint || inputs.run-prettier || inputs.run-cspell) }}
        # When use-consumer-versions is true, npm ci installs only what
        # the consumer's package-lock.json declares. If an enabled tool
        # is missing from that lockfile, the run step would fail later
        # with a generic 'command not found'. Surface a targeted
        # ::error:: annotation here so the GitHub UI points the consumer
        # at the actual fix (edit package.json, re-run npm install,
        # commit the updated lockfile).
        env:
          RUN_MARKDOWNLINT: ${{ inputs.run-markdownlint }}
          RUN_PRETTIER: ${{ inputs.run-prettier }}
          RUN_CSPELL: ${{ inputs.run-cspell }}
        run: |
          missing=0
          fix="add it to devDependencies in package.json"
          fix="${fix} and commit the updated package-lock.json"
          if [ "${RUN_MARKDOWNLINT}" = "true" ] && ! command -v markdownlint-cli2 >/dev/null 2>&1; then
            echo "::error::markdownlint-cli2 is enabled but not installed; ${fix}" >&2
            missing=1
          fi
          if [ "${RUN_PRETTIER}" = "true" ] && ! command -v prettier >/dev/null 2>&1; then
            echo "::error::prettier is enabled but not installed; ${fix}" >&2
            missing=1
          fi
          if [ "${RUN_CSPELL}" = "true" ] && ! command -v cspell >/dev/null 2>&1; then
            echo "::error::cspell is enabled but not installed; ${fix}" >&2
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      # Fetch the installer from the repository and commit this workflow
      # file came from, the model the manifest fetches above follow, so the
      # script and this workflow always share a commit. A `./` action path
      # would resolve against the caller's checkout instead. The `job`
      # context is only available on steps, so the two values are bound
      # here rather than at job or workflow level.
      - name: Fetch install-cspell-dictionaries
        if: ${{ inputs.run-cspell && inputs.extra-cspell-packages != '' }}
        env:
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "${REQ_REPO}" ] || [ -z "${REQ_SHA}" ]; then
            msg="job.workflow_repository or job.workflow_sha is unavailable,"
            msg="${msg} so this workflow cannot fetch its pinned dictionary"
            msg="${msg} installer. Neither is populated on GitHub Enterprise"
            msg="${msg} Server; leave extra-cspell-packages empty there, or"
            msg="${msg} vendor the dictionary and point at it with"
            msg="${msg} dictionaryDefinitions[].path in your cspell config."
            echo "::error::${msg}" >&2
            exit 1
          fi
          base="https://raw.githubusercontent.com/${REQ_REPO}/${REQ_SHA}"
          echo "Fetching from ${base}"
          curl -sSfL --proto '=https' --retry 3 --retry-delay 5 --retry-all-errors \
            "${base}/actions/install-cspell-dictionaries/install-cspell-dictionaries.sh" \
            -o "${RUNNER_TEMP}/install-cspell-dictionaries.sh"

      # Ahead of every linter, so a malformed entry or a digest mismatch
      # fails before any of them runs.
      - name: Install extra cspell dictionaries
        if: ${{ inputs.run-cspell && inputs.extra-cspell-packages != '' }}
        env:
          PACKAGES: ${{ inputs.extra-cspell-packages }}
          INSTALL_DIR: ${{ env.CSPELL_INSTALL_DIR }}
        run: bash "${RUNNER_TEMP}/install-cspell-dictionaries.sh"

      # Same fetch model as the dictionary installer above and the yamllint
      # manifest below: the installer comes from the repository and commit
      # this workflow file came from, so script and workflow always share a
      # commit. A `./` action path, which is how this repository's own
      # workflows reach set-up-uv, would resolve against the caller's
      # checkout here.
      - name: Fetch install-pinned-tool
        if: inputs.run-yamllint
        env:
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "${REQ_REPO}" ] || [ -z "${REQ_SHA}" ]; then
            msg="job.workflow_repository or job.workflow_sha is unavailable,"
            msg="${msg} so this workflow cannot fetch its pinned installer."
            msg="${msg} Neither is populated on GitHub Enterprise Server; set"
            msg="${msg} run-yamllint: false there."
            echo "::error::${msg}" >&2
            exit 1
          fi
          base="https://raw.githubusercontent.com/${REQ_REPO}/${REQ_SHA}"
          echo "Fetching from ${base}"
          curl -sSfL --proto '=https' --retry 3 --retry-delay 5 --retry-all-errors \
            "${base}/actions/install-pinned-tool/install-pinned-tool.sh" \
            -o "${RUNNER_TEMP}/install-pinned-tool.sh"

      # Unused installer variables are not blanked here, as they are in the
      # composite actions: a reusable workflow does not inherit the caller's
      # job-level env, so there is nothing to shadow.
      - name: Install uv
        if: inputs.run-yamllint
        env:
          TOOL: uv
          VERSION: ${{ env.UV_VERSION }}
          URL_TEMPLATE: https://github.com/astral-sh/uv/releases/download/{version}/uv-{arch}-{os}.tar.gz
          CHECKSUMS_URL_TEMPLATE: https://github.com/astral-sh/uv/releases/download/{version}/uv-{arch}-{os}.tar.gz.sha256
          OS_NAMES: linux=unknown-linux-gnu darwin=apple-darwin
          ARCH_NAMES: amd64=x86_64 arm64=aarch64
          ARCHIVE_MEMBER: uv-{arch}-{os}/uv
        run: bash "${RUNNER_TEMP}/install-pinned-tool.sh"

      - name: Install yamllint with hash-pinned requirements
        if: inputs.run-yamllint
        env:
          # Pin the requirements file to the repository and commit this
          # workflow file came from, so callers cannot pick up a tampered
          # hash list. See the npm install step above for why the `job`
          # context rather than `github.*` supplies these.
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "${REQ_REPO}" ] || [ -z "${REQ_SHA}" ]; then
            msg="job.workflow_repository or job.workflow_sha is unavailable,"
            msg="${msg} so the hash-pinned yamllint requirements cannot be"
            msg="${msg} fetched. Neither is populated on GitHub Enterprise"
            msg="${msg} Server; set run-yamllint: false there."
            echo "::error::${msg}" >&2
            exit 1
          fi
          base="https://raw.githubusercontent.com/${REQ_REPO}/${REQ_SHA}"
          echo "Fetching from ${base}"
          curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/yamllint-requirements.txt" \
            "${base}/requirements/yamllint.txt"
          uv venv "${RUNNER_TEMP}/yamllint-venv" --quiet
          uv pip install \
            --python "${RUNNER_TEMP}/yamllint-venv/bin/python" \
            --require-hashes \
            -r "${RUNNER_TEMP}/yamllint-requirements.txt" \
            --quiet
          printf '%s\n' "${RUNNER_TEMP}/yamllint-venv/bin" >> "${GITHUB_PATH}"

      # This step keeps the default success() gate. A setup failure skips
      # it, so the linters below cannot run with incomplete setup.
      - name: Lint tools ready
        id: lint-tools-ready
        run: echo "Lint tool setup completed."

      # An explicit status function lets every enabled tool report after
      # another linter fails, while cancellation and setup failures stop them.
      - name: Run markdownlint
        if: ${{ !cancelled() && steps.lint-tools-ready.outcome == 'success' && inputs.run-markdownlint }}
        run: markdownlint-cli2 "**/*.md"

      - name: Run Prettier check
        if: ${{ !cancelled() && steps.lint-tools-ready.outcome == 'success' && inputs.run-prettier }}
        run: prettier --check .

      # Mirrors actions/run-cspell's argument assembly: an empty config
      # leaves auto-discovery alone, and files are newline-delimited so a
      # glob containing spaces survives.
      - name: Run cspell
        if: ${{ !cancelled() && steps.lint-tools-ready.outcome == 'success' && inputs.run-cspell }}
        env:
          CSPELL_CONFIG: ${{ inputs.cspell-config }}
          CSPELL_FILES: ${{ inputs.cspell-files }}
        run: |
          args=()
          if [ -n "${CSPELL_CONFIG}" ]; then
            args+=(--config "${CSPELL_CONFIG}")
          fi
          files=()
          while IFS= read -r line; do
            [ -n "${line}" ] && files+=("${line}")
          done <<< "${CSPELL_FILES}"
          cspell "${args[@]}" "${files[@]}"

      - name: Run yamllint
        if: ${{ !cancelled() && steps.lint-tools-ready.outcome == 'success' && inputs.run-yamllint }}
        run: yamllint .
