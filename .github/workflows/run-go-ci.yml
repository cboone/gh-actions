name: Run Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: >-
          Go version to install. When set, overrides go-version-file.
        type: string
        default: ""
      go-version-file:
        description: File to read the Go version from.
        type: string
        default: go.mod
      runs-on:
        description: >-
          Runner label (ubuntu-latest or macos-latest recommended;
          Windows is not supported).
        type: string
        default: ubuntu-latest
      run-lint:
        description: Run golangci-lint.
        type: boolean
        default: true
      golangci-lint-version:
        description: golangci-lint version to install.
        type: string
        default: "2.13.2"
      run-scrut:
        description: Run scrut CLI tests.
        type: boolean
        default: false
      scrut-build-cmd:
        description: >-
          Command to build the binary for scrut tests. Override this
          when scrut tests reference a binary by path or env var.
        type: string
        default: "go build ./..."
      scrut-env:
        description: >-
          Newline-delimited KEY=VALUE environment variables to export
          when running scrut tests (e.g. BOPCA_BIN=./bin/bopca).
        type: string
        default: ""
      scrut-test-dir:
        description: Directory containing scrut test files.
        type: string
        default: "tests/"
      scrut-setup-cmd:
        description: >-
          Optional shell command to run before scrut tests (after Go setup).
          Use this to install extra dependencies like uv or Python tools
          needed by scrut test fixtures.
        type: string
        default: ""
      run-format-check:
        description: Run make fmt format check.
        type: boolean
        default: false
      run-build:
        description: Run go build.
        type: boolean
        default: false
      test-flags:
        description: >-
          Space-separated flags for go test, on a single line, used only
          when coverage is enabled. Quoting, escaping and glob expansion
          are not supported.
        type: string
        default: "-race"
      coverage:
        description: Generate coverage and upload to Codecov.
        type: boolean
        default: false
      codecov-cli-version:
        description: Codecov CLI version to install.
        type: string
        default: "11.3.1"
      codecov-files:
        description: Single coverage file path (used for -coverprofile and Codecov upload).
        type: string
        default: coverage.out
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 15
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version || null }}
          go-version-file: >-
            ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
          cache: true

      - name: Run vet
        run: make vet

      - name: Run tests
        if: ${{ !inputs.coverage }}
        run: make test

      - name: Run tests with coverage
        if: ${{ inputs.coverage }}
        shell: bash
        env:
          TEST_FLAGS: ${{ inputs.test-flags }}
          CODECOV_FILE: ${{ inputs.codecov-files }}
        run: |
          if [[ "${TEST_FLAGS}" == *$'\n'* ]]; then
            echo "::error::test-flags must be a single line of space-separated flags" >&2
            exit 1
          fi
          args=(go test -v)
          read -r -a extra <<< "${TEST_FLAGS}"
          if [[ ${#extra[@]} -gt 0 ]]; then
            args+=("${extra[@]}")
          fi
          args+=("-coverprofile=${CODECOV_FILE}" ./...)
          "${args[@]}"

      - name: Upload coverage to Codecov
        if: inputs.coverage
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          CODECOV_CLI_VERSION: ${{ inputs.codecov-cli-version }}
          CODECOV_FILE: ${{ inputs.codecov-files }}
        run: |
          # Unset empty token so the CLI uses tokenless mode for public repos
          # instead of treating the empty string as an invalid token.
          if [ -z "${CODECOV_TOKEN}" ]; then
            unset CODECOV_TOKEN
          fi

          case "${RUNNER_OS}" in
            Linux) codecov_os="linux" ;;
            macOS) codecov_os="macos" ;;
            *)
              echo "Unsupported runner operating system: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

          codecov_bin="${RUNNER_TEMP}/codecov"
          base_url="https://cli.codecov.io/v${CODECOV_CLI_VERSION}/${codecov_os}"
          curl -sSfL "${base_url}/codecov" -o "${codecov_bin}"
          curl -sSfL "${base_url}/codecov.SHA256SUM" -o "${codecov_bin}.sha256"
          expected="$(awk '{print $1}' "${codecov_bin}.sha256")"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${codecov_bin}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${codecov_bin}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "Checksum verification failed for codecov" >&2
            echo "Expected: ${expected}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          chmod +x "${codecov_bin}"
          "${codecov_bin}" upload-process \
            --file "${CODECOV_FILE}" \
            --disable-search

  lint:
    name: Lint
    if: inputs.run-lint
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version || null }}
          go-version-file: >-
            ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
          cache: true

      - name: Install golangci-lint
        shell: bash
        env:
          VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          case "$(uname -s)" in
            Linux) os="linux" ;;
            Darwin) os="darwin" ;;
            *)
              echo "Unsupported operating system: $(uname -s)" >&2
              exit 1
              ;;
          esac

          case "$(uname -m)" in
            x86_64) arch="amd64" ;;
            arm64|aarch64) arch="arm64" ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          archive="golangci-lint-${VERSION}-${os}-${arch}.tar.gz"
          bin_dir="${RUNNER_TEMP}/golangci-lint-bin"
          mkdir -p "${bin_dir}"
          base_url="https://github.com/golangci/golangci-lint/releases/download/v${VERSION}"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -sSfL "${base_url}/${archive}" -o "${archive_path}"
          curl -sSfL "${base_url}/golangci-lint-${VERSION}-checksums.txt" \
            -o "${RUNNER_TEMP}/golangci-lint-checksums.txt"
          expected="$(grep -F "${archive}" "${RUNNER_TEMP}/golangci-lint-checksums.txt" | head -1 | awk '{print $1}')"
          if [ -z "${expected}" ]; then
            echo "Checksum entry not found for ${archive}" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${archive_path}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${archive_path}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "Checksum verification failed for ${archive}" >&2
            echo "Expected: ${expected}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          tar -xz -C "${RUNNER_TEMP}" -f "${archive_path}"
          install -m 0755 \
            "${RUNNER_TEMP}/golangci-lint-${VERSION}-${os}-${arch}/golangci-lint" \
            "${bin_dir}/golangci-lint"
          printf '%s\n' "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Run lint
        run: make lint

  build:
    name: Build
    if: inputs.run-build
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version || null }}
          go-version-file: >-
            ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
          cache: true

      - name: Build
        run: make build

  scrut:
    name: Scrut
    if: inputs.run-scrut
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version || null }}
          go-version-file: >-
            ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
          cache: true

      - name: Scrut test setup
        if: inputs.scrut-setup-cmd != ''
        run: ${{ inputs.scrut-setup-cmd }}

      - name: Build binary for scrut tests
        run: ${{ inputs.scrut-build-cmd }}

      - name: Set up Rust for Scrut source build
        if: (runner.os == 'Linux' && runner.arch == 'ARM64') || (runner.os == 'macOS' && runner.arch == 'X64')
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-06-30
        with:
          toolchain: "1.97.1"

      - name: Build scrut from pinned source
        if: (runner.os == 'Linux' && runner.arch == 'ARM64') || (runner.os == 'macOS' && runner.arch == 'X64')
        shell: bash
        env:
          VERSION: "0.4.3"
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "${REQ_REPO}" ] || [ -z "${REQ_SHA}" ]; then
            msg="Cannot fetch pinned Scrut source-build files without"
            msg="${msg} job.workflow_repository and job.workflow_sha."
            echo "::error::${msg} Scrut source builds require GitHub.com." >&2
            exit 1
          fi
          base="https://raw.githubusercontent.com/${REQ_REPO}/${REQ_SHA}/actions/set-up-scrut"
          helper_dir="$(mktemp -d "${RUNNER_TEMP}/scrut-helper.XXXXXX")"
          for resource in build-from-source.sh Cargo.lock build-version.rs; do
            curl -sSfL --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 5 --retry-all-errors \
              "${base}/${resource}" -o "${helper_dir}/${resource}"
          done
          bash "${helper_dir}/build-from-source.sh"

      - name: Install scrut
        if: ${{ !((runner.os == 'Linux' && runner.arch == 'ARM64') || (runner.os == 'macOS' && runner.arch == 'X64')) }}
        shell: bash
        env:
          VERSION: "0.4.3"
        run: |
          case "$(uname -s)" in
            Linux) os="linux" ;;
            Darwin) os="macos" ;;
            *)
              echo "Unsupported operating system: $(uname -s)" >&2
              exit 1
              ;;
          esac

          case "$(uname -m)" in
            x86_64) arch="x86_64" ;;
            arm64|aarch64) arch="aarch64" ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          # Hardcoded SHA-256 checksums for scrut v0.4.3 release tarballs.
          # scrut upstream does not publish checksum files, so these are
          # computed from the release artifacts and must be updated when
          # VERSION changes.
          case "${os}-${arch}" in
            linux-x86_64)  expected="6aefb0bff29b450fbd1b04083eefeae4388d6c9302e31d1a24b7aa9edd03bb35" ;;
            macos-aarch64) expected="3c0bc8d455fddb382e1e9099f5f4a4e0b8e925b19fa588c2176bc046383d9abc" ;;
            *)
              echo "No checksum available for ${os}-${arch}" >&2
              exit 1
              ;;
          esac

          tarball="scrut-v${VERSION}-${os}-${arch}.tar.gz"
          base="https://github.com/facebookincubator/scrut/releases/download/v${VERSION}"
          install_dir="${RUNNER_TEMP}/scrut-bin"
          mkdir -p "${install_dir}"
          tarball_path="${RUNNER_TEMP}/${tarball}"
          curl -sSfL -o "${tarball_path}" "${base}/${tarball}"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tarball_path}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tarball_path}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "Checksum verification failed for ${tarball}" >&2
            echo "Expected: ${expected}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          tar -xz -C "${install_dir}" -f "${tarball_path}" --strip-components=1
          version_output="$("${install_dir}/scrut" --version)"
          if [[ "${version_output}" != "scrut ${VERSION}" ]]; then
            echo "Unexpected Scrut version: ${version_output}; expected scrut ${VERSION}" >&2
            exit 1
          fi
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Run scrut tests
        shell: bash
        env:
          SCRUT_ENV: ${{ inputs.scrut-env }}
          SCRUT_TEST_DIR: ${{ inputs.scrut-test-dir }}
        run: |
          if [ -n "${SCRUT_ENV}" ]; then
            while IFS= read -r line; do
              if [ -n "${line}" ]; then
                key="${line%%=*}"
                value="${line#*=}"
                # Resolve ./relative paths to absolute so scrut
                # subprocesses find binaries from any working directory.
                case "${value}" in
                  ./*) value="${PWD}/${value#./}" ;;
                esac
                export "${key}=${value}"
              fi
            done <<< "${SCRUT_ENV}"
          fi
          scrut test "${SCRUT_TEST_DIR}"

  format-check:
    name: Format check
    if: inputs.run-format-check
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version || null }}
          go-version-file: >-
            ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
          cache: true

      - name: Check formatting
        run: make fmt
