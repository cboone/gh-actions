name: Deploy to Pages

on:
  workflow_call:
    inputs:
      build-command:
        description: Command to build the site.
        type: string
        required: true
      artifact-path:
        description: Path to the built site directory.
        type: string
        default: ./_site
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest
      setup-go:
        description: Set up Go before building.
        type: boolean
        default: false
      go-version-file:
        description: File to read the Go version from.
        type: string
        default: go.mod
      setup-node:
        description: Set up Node.js before building.
        type: boolean
        default: false
      node-version:
        description: Node.js version to install.
        type: string
        default: "24.21.0"
      allow-npm-install:
        description: Permit npm install when the repository has no lockfile.
        type: boolean
        default: false
      run-install-scripts:
        description: Run dependency lifecycle scripts while installing.
        type: boolean
        default: false
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 15

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect npm cache lockfile
        id: npm-cache
        if: inputs.setup-node
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "cache=npm" >> "${GITHUB_OUTPUT}"
            echo "cache-dependency-path=package-lock.json" >> "${GITHUB_OUTPUT}"
          elif [ -f npm-shrinkwrap.json ]; then
            echo "cache=npm" >> "${GITHUB_OUTPUT}"
            echo "cache-dependency-path=npm-shrinkwrap.json" >> "${GITHUB_OUTPUT}"
          else
            echo "cache=" >> "${GITHUB_OUTPUT}"
            echo "cache-dependency-path=" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.setup-go
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      # `cache` and `package-manager-cache` are an if/else inside the action, so
      # turning the automatic branch off leaves the explicit one above it
      # untouched: a build with a lockfile still caches. Without that, a caller
      # whose package.json names npm in packageManager gets automatic caching
      # even when the probe above found no lockfile, and the action fails with
      # `Dependencies lock file is not found` before the install step can report
      # which input to set.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.setup-node
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.npm-cache.outputs.cache }}
          cache-dependency-path: >-
            ${{ steps.npm-cache.outputs.cache-dependency-path }}
          package-manager-cache: false

      # Byte-identical to the install steps in publish-to-npm.yml and
      # publish-to-npm-with-oidc.yml; the `parity` scenario in
      # tests/fixtures/check-npm-publish.mjs fails if one copy drifts.
      - name: Install dependencies
        if: inputs.setup-node
        shell: bash
        env:
          LOCKFILE: ${{ steps.npm-cache.outputs.cache-dependency-path }}
          ALLOW_NPM_INSTALL: ${{ inputs.allow-npm-install }}
          RUN_INSTALL_SCRIPTS: ${{ inputs.run-install-scripts }}
        run: |
          args=(--include=dev --no-audit --no-fund)
          [[ "${RUN_INSTALL_SCRIPTS}" == "true" ]] || args+=(--ignore-scripts)
          if [[ -n "${LOCKFILE}" ]]; then
            npm ci "${args[@]}"
          elif [[ "${ALLOW_NPM_INSTALL}" == "true" ]]; then
            echo "::warning::No lockfile found; npm install resolves versions at run time."
            npm install "${args[@]}"
          else
            echo "::error::No lockfile found. Commit package-lock.json, or set allow-npm-install: true."
            exit 1
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site
        run: ${{ inputs.build-command }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.artifact-path }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
