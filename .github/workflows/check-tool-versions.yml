name: Check tool versions

on:
  schedule:
    # Mondays at 13:00 UTC. Cron runs in UTC year-round; the
    # wall-clock time in any local zone shifts with DST. This workflow
    # tracks tools Dependabot doesn't, so its timing relative to the
    # weekly Dependabot run is not material.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE_TITLE: "Outdated pinned tool versions"
      ISSUE_LABEL: "dependencies"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This workflow is not reusable, so a `./` action path resolves against
      # this repository's own checkout above. It can use the action directly
      # rather than fetching install-pinned-tool.sh the way the reusable
      # workflows have to. The pinned version is set-up-uv's default, so this
      # file carries no uv pin of its own.
      - name: Install uv
        uses: ./actions/set-up-uv

      - name: Run version check
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          report="${RUNNER_TEMP}/report.md"
          set +e
          ./scripts/check-tool-versions.py > "${report}"
          status=$?
          set -e

          # Print whatever the run produced before deciding its fate, so a
          # status this step is about to reject still leaves its partial
          # output in the log.
          echo "::group::Report"
          cat "${report}"
          echo "::endgroup::"

          # 0, 1 and 2 are the script's entire contract. Anything else means
          # it did not run to completion: an exception outside the per-tool
          # try in main(), an unparseable PEP 723 header, or uv failing to
          # resolve an interpreter. All of those write to stderr and leave
          # stdout empty, so the report printed above is not an issue body.
          case "${status}" in
            0 | 1 | 2) ;;
            *)
              msg="check-tool-versions.py exited ${status}"
              echo "::error::${msg}; expected 0, 1 or 2." >&2
              exit 1
              ;;
          esac

          # A non-zero status is supposed to imply a non-empty report, but
          # nothing in the script enforces that. Refuse rather than hand an
          # empty body to `gh issue edit`, which would erase the very issue
          # that reports the problem. Any byte counts as a report: every
          # failure above leaves stdout completely empty, so a whitespace-aware
          # test would reject nothing this one does not. Status 0 is exempt
          # because main() returns it only after the tool loop completes, and
          # that path always prints the current-versions line.
          if [ "${status}" != "0" ] && [ ! -s "${report}" ]; then
            msg="check-tool-versions.py exited ${status} with an empty report"
            echo "::error::${msg}; refusing to overwrite the tracking issue." >&2
            exit 1
          fi

          # Published last: the steps below key on `status`, and an
          # unvalidated value must never reach them, including through an
          # `if:` condition that runs on failure.
          {
            echo "status=${status}"
            echo "report-path=${report}"
          } >> "${GITHUB_OUTPUT}"

      - name: Open or update tracking issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.check.outputs.report-path }}
          REPO: ${{ github.repository }}
        run: |
          # Find an existing open issue with the same title; update it
          # in place so we don't accumulate duplicates week over week.
          existing="$(gh issue list \
            --repo "${REPO}" \
            --state open \
            --label "${ISSUE_LABEL}" \
            --search "in:title \"${ISSUE_TITLE}\"" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" \
              --repo "${REPO}" \
              --body-file "${REPORT}"
            echo "Updated issue #${existing}"
          else
            gh issue create \
              --repo "${REPO}" \
              --title "${ISSUE_TITLE}" \
              --label "${ISSUE_LABEL}" \
              --body-file "${REPORT}"
          fi

      - name: Close tracking issue when everything is current
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          existing="$(gh issue list \
            --repo "${REPO}" \
            --state open \
            --label "${ISSUE_LABEL}" \
            --search "in:title \"${ISSUE_TITLE}\"" \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue close "${existing}" \
              --repo "${REPO}" \
              --comment "All pinned tool versions are current."
            echo "Closed issue #${existing}"
          fi

      - name: Fail job on lookup errors
        if: steps.check.outputs.status == '2'
        run: |
          echo "::error::One or more upstream version lookups failed; see report above."
          exit 1
