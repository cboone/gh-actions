name: Check tool versions

on:
  schedule:
    # Mondays at 13:00 UTC. Cron runs in UTC year-round; the
    # wall-clock time in any local zone shifts with DST. This workflow
    # tracks tools Dependabot doesn't, so its timing relative to the
    # weekly Dependabot run is not material.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE_TITLE: "Outdated pinned tool versions"
      ISSUE_LABEL: "dependencies"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This workflow is not reusable, so a `./` action path resolves against
      # this repository's own checkout above. It can use the action directly
      # rather than fetching install-pinned-tool.sh the way the reusable
      # workflows have to. The pinned version is set-up-uv's default, so this
      # file carries no uv pin of its own.
      - name: Install uv
        uses: ./actions/set-up-uv

      - name: Run version check
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./scripts/check-tool-versions.py > "${RUNNER_TEMP}/report.md"
          status=$?
          set -e
          {
            echo "status=${status}"
            echo "report-path=${RUNNER_TEMP}/report.md"
          } >> "${GITHUB_OUTPUT}"
          echo "::group::Report"
          cat "${RUNNER_TEMP}/report.md"
          echo "::endgroup::"

      - name: Open or update tracking issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.check.outputs.report-path }}
          REPO: ${{ github.repository }}
        run: |
          # Find an existing open issue with the same title; update it
          # in place so we don't accumulate duplicates week over week.
          existing="$(gh issue list \
            --repo "${REPO}" \
            --state open \
            --label "${ISSUE_LABEL}" \
            --search "in:title \"${ISSUE_TITLE}\"" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" \
              --repo "${REPO}" \
              --body-file "${REPORT}"
            echo "Updated issue #${existing}"
          else
            gh issue create \
              --repo "${REPO}" \
              --title "${ISSUE_TITLE}" \
              --label "${ISSUE_LABEL}" \
              --body-file "${REPORT}"
          fi

      - name: Close tracking issue when everything is current
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          existing="$(gh issue list \
            --repo "${REPO}" \
            --state open \
            --label "${ISSUE_LABEL}" \
            --search "in:title \"${ISSUE_TITLE}\"" \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue close "${existing}" \
              --repo "${REPO}" \
              --comment "All pinned tool versions are current."
            echo "Closed issue #${existing}"
          fi

      - name: Fail job on lookup errors
        if: steps.check.outputs.status == '2'
        run: |
          echo "::error::One or more upstream version lookups failed; see report above."
          exit 1
