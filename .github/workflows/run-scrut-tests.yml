name: Run scrut tests

on:
  workflow_call:
    inputs:
      scrut-version:
        description: >-
          scrut version to install. Only the version with pinned checksums
          is supported; update the checksums in this workflow to use a
          different version.
        type: string
        default: "0.4.3"
      scrut-shell:
        description: >-
          Shell to use for scrut tests (e.g. "zsh", "bash"). When set,
          passes --shell to scrut.
        type: string
        default: ""
      scrut-test-dir:
        description: Directory containing scrut test files.
        type: string
        default: "tests/"
      scrut-env:
        description: >-
          Newline-delimited KEY=VALUE environment variables to export
          when running scrut tests (e.g. MY_BIN=./bin/my-tool).
        type: string
        default: ""
      scrut-setup-cmd:
        description: >-
          Optional shell command to run before scrut tests. Use this to
          install dependencies or prepare fixtures needed by scrut test
          files. It runs after the uv install step, so it can call `uv`
          when setup-uv is true.
        type: string
        default: ""
      setup-uv:
        description: >-
          Install uv and add it to PATH before scrut-setup-cmd runs. Set
          this for a CLI that needs uv at test time, such as a PEP 723
          script with a `#!/usr/bin/env -S uv run --script` shebang.
        type: boolean
        default: false
      uv-version:
        description: uv version to install when setup-uv is true.
        type: string
        default: "0.11.8"
      runs-on:
        description: Runner label (Windows is not supported).
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 10

permissions:
  contents: read

jobs:
  scrut:
    name: Scrut
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetch the installer from the repository and commit this workflow
      # file came from, the supply-chain model lint-text.yml uses for its
      # manifests, so the script and this workflow always share a commit. A
      # `./` action path would resolve against the caller's checkout
      # instead. The `job` context is only available on steps, so the two
      # values are bound here rather than at job or workflow level. The
      # step carries the uv install's condition, so a job that installs
      # nothing never reads the job context.
      - name: Fetch install-pinned-tool
        if: inputs.setup-uv
        shell: bash
        env:
          REQ_REPO: ${{ job.workflow_repository }}
          REQ_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "${REQ_REPO}" ] || [ -z "${REQ_SHA}" ]; then
            msg="job.workflow_repository or job.workflow_sha is unavailable,"
            msg="${msg} so this workflow cannot fetch its pinned installer."
            msg="${msg} Neither is populated on GitHub Enterprise Server; set"
            msg="${msg} setup-uv: false there, and install uv in scrut-setup-cmd"
            msg="${msg} instead."
            echo "::error::${msg}" >&2
            exit 1
          fi
          base="https://raw.githubusercontent.com/${REQ_REPO}/${REQ_SHA}"
          echo "Fetching from ${base}"
          curl -sSfL --proto '=https' --retry 3 --retry-delay 5 --retry-all-errors \
            "${base}/actions/install-pinned-tool/install-pinned-tool.sh" \
            -o "${RUNNER_TEMP}/install-pinned-tool.sh"

      # uv goes on PATH before scrut-setup-cmd so that command can call it.
      # Only `uv` is installed, not `uvx`: `uv tool run` is the equivalent,
      # and a second install would re-download the whole tarball for one
      # more member.
      - name: Install uv
        if: inputs.setup-uv
        shell: bash
        env:
          TOOL: uv
          VERSION: ${{ inputs.uv-version }}
          URL_TEMPLATE: https://github.com/astral-sh/uv/releases/download/{version}/uv-{arch}-{os}.tar.gz
          CHECKSUMS_URL_TEMPLATE: https://github.com/astral-sh/uv/releases/download/{version}/uv-{arch}-{os}.tar.gz.sha256
          OS_NAMES: linux=unknown-linux-gnu darwin=apple-darwin
          ARCH_NAMES: amd64=x86_64 arm64=aarch64
          ARCHIVE_MEMBER: uv-{arch}-{os}/uv
        run: bash "${RUNNER_TEMP}/install-pinned-tool.sh"

      - name: Scrut test setup
        if: inputs.scrut-setup-cmd != ''
        run: ${{ inputs.scrut-setup-cmd }}

      - name: Set up Rust for Linux arm64 source build
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-06-30
        with:
          toolchain: "1.97.1"

      - name: Build scrut for Linux arm64
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        shell: bash
        env:
          VERSION: ${{ inputs.scrut-version }}
          SOURCE_REPO: ${{ job.workflow_repository }}
          SOURCE_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ -z "${SOURCE_REPO}" || -z "${SOURCE_SHA}" ]]; then
            echo "::error::Linux arm64 source builds require job.workflow_repository and job.workflow_sha."
            echo "::error::These contexts are unavailable on GHES; install Scrut with the set-up-scrut action instead."
            exit 1
          fi
          build_dir="$(mktemp -d "${RUNNER_TEMP}/scrut-build.XXXXXX")"
          source_url="https://raw.githubusercontent.com/${SOURCE_REPO}/${SOURCE_SHA}/actions/set-up-scrut"
          for file in build-from-source.sh Cargo.lock; do
            curl -sSfL --proto '=https' --proto-redir '=https' -o "${build_dir}/${file}" "${source_url}/${file}"
          done
          bash "${build_dir}/build-from-source.sh"

      - name: Install scrut
        if: runner.os != 'Linux' || runner.arch != 'ARM64'
        shell: bash
        env:
          VERSION: ${{ inputs.scrut-version }}
        run: |
          case "$(uname -s)" in
            Linux) os="linux" ;;
            Darwin) os="macos" ;;
            *)
              echo "Unsupported operating system: $(uname -s)" >&2
              exit 1
              ;;
          esac

          case "$(uname -m)" in
            x86_64) arch="x86_64" ;;
            arm64|aarch64) arch="aarch64" ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          # Hardcoded SHA-256 checksums for scrut v0.4.3 release tarballs.
          # scrut upstream does not publish checksum files, so these are
          # computed from the release artifacts and must be updated when
          # VERSION changes.
          supported_version="0.4.3"
          if [ "${VERSION}" != "${supported_version}" ]; then
            echo "Unsupported scrut version: ${VERSION}" >&2
            echo "Checksums are only available for v${supported_version}." >&2
            echo "To use a different version, update the checksums in this workflow." >&2
            exit 1
          fi

          case "${os}-${arch}" in
            linux-x86_64)  expected="6aefb0bff29b450fbd1b04083eefeae4388d6c9302e31d1a24b7aa9edd03bb35" ;;
            linux-aarch64) expected="a67117f4320d129c7d7073a5e667dbad25e7a83f31480a633108250fe4069dd5" ;;
            macos-x86_64)  expected="2589730051127e114e2014916e51e7eaceb01f59ea7bfb2aa59bf36c8fa2cc9e" ;;
            macos-aarch64) expected="3c0bc8d455fddb382e1e9099f5f4a4e0b8e925b19fa588c2176bc046383d9abc" ;;
            *)
              echo "No checksum available for ${os}-${arch}" >&2
              exit 1
              ;;
          esac

          tarball="scrut-v${VERSION}-${os}-${arch}.tar.gz"
          base="https://github.com/facebookincubator/scrut/releases/download/v${VERSION}"
          install_dir="${RUNNER_TEMP}/scrut-bin"
          mkdir -p "${install_dir}"
          tarball_path="${RUNNER_TEMP}/${tarball}"
          curl -sSfL -o "${tarball_path}" "${base}/${tarball}"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tarball_path}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tarball_path}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "Checksum verification failed for ${tarball}" >&2
            echo "Expected: ${expected}" >&2
            echo "Actual:   ${actual}" >&2
            exit 1
          fi
          tar -xz -C "${install_dir}" -f "${tarball_path}" --strip-components=1
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/scrut" --version

      - name: Run scrut tests
        shell: bash
        env:
          SCRUT_ENV: ${{ inputs.scrut-env }}
          SCRUT_SHELL: ${{ inputs.scrut-shell }}
          SCRUT_TEST_DIR: ${{ inputs.scrut-test-dir }}
        run: |
          if [ -n "${SCRUT_ENV}" ]; then
            while IFS= read -r line; do
              if [ -n "${line}" ]; then
                case "${line}" in
                  *=*) ;;
                  *) echo "::error::Invalid SCRUT_ENV line (missing '='): ${line}" && exit 1 ;;
                esac
                key="${line%%=*}"
                value="${line#*=}"
                # Resolve ./relative paths to absolute so scrut
                # subprocesses find binaries from any working directory.
                case "${value}" in
                  ./*) value="${PWD}/${value#./}" ;;
                esac
                export "${key}=${value}"
              fi
            done <<< "${SCRUT_ENV}"
          fi

          args=("test")
          if [ -n "${SCRUT_SHELL}" ]; then
            args+=("--shell" "${SCRUT_SHELL}")
          fi
          args+=("${SCRUT_TEST_DIR}")

          scrut "${args[@]}"
